---
test_name: Account RC footprint rejects invalid group_by

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Reject unsupported group_by
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "hiveio"
        group_by: "invalid"
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
