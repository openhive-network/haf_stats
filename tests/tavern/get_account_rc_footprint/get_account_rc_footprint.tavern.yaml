---
test_name: Account RC footprint prices the account's signed ops on-demand

marks:
  - synthetic

includes:
  - !include ../common.yaml

# Reads hive.account_operations_view on-demand (ci_setup), counting only ops the
# account SIGNED (account_id = transacting_account_id = the RC payer) and pricing them from
# rc_op_stats_daily (#33). rctester in March 2021 signed 4 votes (op 1) and 2 custom_json
# (op 18); a received vote and a virtual producer_reward are present but excluded. vote
# avg_cost 97,278,897, custom_json avg_cost 167,828,015 (2020-06-08 rate, effective on/before
# 2021-03). op_type: 4*97278897=389115588, 2*167828015=335656030. app: custom_json apps come
# from account_custom_json_daily (size-aware op-18 rate, sm_claim_daily 2*1000+200*100=22000),
# with each json_id resolved to its DApp name via custom_json_app_registry (sm_claim_daily
# starts_with 'sm_' -> "Splinterlands"); other signed ops roll into one non-custom_json
# bucket (the 4 votes = 389115588).
stages:
  - name: group_by=op_type ranks op types by estimated RC (excludes received + virtual ops)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        group_by: "op_type"
    response:
      status_code: 200
      json:
        - label: "vote_operation"
          rc_consumed: 389115588
          op_count: 4
          pct: 53.69
        - label: "custom_json_operation"
          rc_consumed: 335656030
          op_count: 2
          pct: 46.31

  - name: group_by=app resolves custom_json apps to DApp names, split from a non-custom_json bucket
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        group_by: "app"
    response:
      status_code: 200
      json:
        - label: "non-custom_json"
          rc_consumed: 389115588
          op_count: 4
          pct: 99.99
        - label: "Splinterlands"
          rc_consumed: 22000
          op_count: 2
          pct: 0.01

  # group_by=category rolls each app one registry level up: sm_claim_daily -> Splinterlands -> the
  # "Gaming" category (same byte-aware 22000/2 figures relabelled), while the non-custom_json bucket
  # is unchanged - so the category breakdown reconciles exactly with group_by=app summed by category.
  - name: group_by=category rolls custom_json apps up to their registry category
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        group_by: "category"
    response:
      status_code: 200
      json:
        - label: "non-custom_json"
          rc_consumed: 389115588
          op_count: 4
          pct: 99.99
        - label: "Gaming"
          rc_consumed: 22000
          op_count: 2
          pct: 0.01

---
test_name: Account RC footprint group_by=app merges shared DApps and keeps unmatched ids raw

marks:
  - synthetic

includes:
  - !include ../common.yaml

# dapptester (2001) reuses the get_account_dapp_footprint fixture, so the per-app RC values
# match it exactly. Two json_ids that share a DApp roll up into one row:
# sm_claim_daily (25 ops, 06-01) + sm_battle (5 ops, 06-05) -> Splinterlands (30 ops, 6000),
# both at the cheap 06-01 op-18 rate (100/10). ssc-mainnet-hive -> Hive Engine (SSC) (20, 7000);
# follow -> Hivemind Follow (10, 15000, pricey 06-08 rate); mystery_app matches no registry
# pattern -> kept raw (5, 85000). The 07-01 sm_market row is outside the window. dapptester's two
# op-18 rows in account_operations_view only open the read window (op 18 is excluded from the
# non-custom_json bucket), so the result is purely these four resolved apps, ordered by RC desc.
stages:
  - name: ids sharing a DApp merge under one name; unmatched ids stay raw
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "dapptester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        group_by: "app"
    response:
      status_code: 200
      json:
        - label: "mystery_app"
          rc_consumed: 85000
          op_count: 5
          pct: 75.22
        - label: "Hivemind Follow"
          rc_consumed: 15000
          op_count: 10
          pct: 13.27
        - label: "Hive Engine (SSC)"
          rc_consumed: 7000
          op_count: 20
          pct: 6.19
        - label: "Splinterlands"
          rc_consumed: 6000
          op_count: 30
          pct: 5.31

  # group_by=category rolls those same apps up to their registry categories, exercising the
  # Uncategorized fallback: mystery_app (no registry match) -> Uncategorized, follow -> Social Graph,
  # ssc-mainnet-hive -> DeFi & Tokens, sm_* -> Gaming. Each app maps to a distinct category here, so
  # the per-category RC/op figures (and pct) equal the group_by=app rows relabelled by category.
  - name: group_by=category buckets unmatched ids as Uncategorized and reconciles with group_by=app
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "dapptester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        group_by: "category"
    response:
      status_code: 200
      json:
        - label: "Uncategorized"
          rc_consumed: 85000
          op_count: 5
          pct: 75.22
        - label: "Social Graph"
          rc_consumed: 15000
          op_count: 10
          pct: 13.27
        - label: "DeFi & Tokens"
          rc_consumed: 7000
          op_count: 20
          pct: 6.19
        - label: "Gaming"
          rc_consumed: 6000
          op_count: 30
          pct: 5.31

  # #44: rcexact's ops sit in transactions with a recorded rc_cost (ci_setup.sql), so each is
  # priced with its EXACT share of its transaction's cost, not the op-count estimate. The one
  # vote whose transaction has no rc_cost keeps the estimate (97,278,897). Shares, from
  # ci_setup.sql: votes 100000000 + 89878541 + 73388427 + 97278897 + 50000000 = 410,545,865;
  # custom_json 2 * 155060730 = 310,121,460. The received op and the virtual op are excluded
  # as for rctester.
  - name: group_by=op_type prices ops exactly where the transaction records its RC cost
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-20"
        to_date: "2021-03-20"
        group_by: "op_type"
    response:
      status_code: 200
      json:
        - label: "vote_operation"
          rc_consumed: 410545865
          op_count: 5
          pct: 56.97
        - label: "custom_json_operation"
          rc_consumed: 310121460
          op_count: 2
          pct: 43.03

  # The non-custom_json bucket of group_by=app takes the same exact path (the 5 votes,
  # 410,545,865). The custom_json bucket still comes from the per-account rollup, which carries
  # only the byte-aware estimate (2*1000 + 200*100 = 22000) until the rollups record exact RC.
  - name: group_by=app prices the non-custom_json bucket exactly
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-20"
        to_date: "2021-03-20"
        group_by: "app"
    response:
      status_code: 200
      json:
        - label: "non-custom_json"
          rc_consumed: 410545865
          op_count: 5
          pct: 99.99
        - label: "Splinterlands"
          rc_consumed: 22000
          op_count: 2
          pct: 0.01

  # #44, rcexact's second day (ci_setup.sql, block 6503): the vote's weight is the vote rate of
  # THAT day (300,000,000), and the two transfers have a zero rate, clamped to weight 1 each.
  - name: a split weighs each op at its own day's rate, and a zero rate does not divide by zero
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-21"
        to_date: "2021-03-21"
        group_by: "op_type"
    response:
      status_code: 200
      json:
        - label: "vote_operation"
          rc_consumed: 384756778
          op_count: 1
          pct: 64.02
        - label: "custom_json_operation"
          rc_consumed: 215243222
          op_count: 1
          pct: 35.81
        - label: "transfer_operation"
          rc_consumed: 1000001
          op_count: 2
          pct: 0.17

  # Both days in one call: each transaction is still split at its own day's rates, so the figures
  # are the two single-day results added up.
  - name: a window over two days adds up the per-day exact figures
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-20"
        to_date: "2021-03-21"
        group_by: "op_type"
    response:
      status_code: 200
      json:
        - label: "vote_operation"
          rc_consumed: 795302643
          op_count: 6
          pct: 60.17
        - label: "custom_json_operation"
          rc_consumed: 525364682
          op_count: 3
          pct: 39.75
        - label: "transfer_operation"
          rc_consumed: 1000001
          op_count: 2
          pct: 0.08
