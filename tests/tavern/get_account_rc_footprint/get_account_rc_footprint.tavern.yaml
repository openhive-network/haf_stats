---
test_name: Account RC footprint is empty before RC exists

marks:
  - patterntest

includes:
  - !include ../common.yaml

stages:
  - name: GET /rpc/get_account_rc_footprint in 2016-04
    request:
      url: "{api_url}/rpc/get_account_rc_footprint"
      method: GET
      params:
        account: "hiveio"
        from_date: "2016-04-01"
        to_date: "2016-04-30"
        group_by: "op_type"
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
