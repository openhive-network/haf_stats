---
test_name: A HEAD answers with the GET's status and no body, and the connection stays framed

marks:
  - synthetic

includes:
  - !include ../common.yaml
  - !include rewriter_common.yaml

# The module forwards a HEAD as a POST too, and gives it its method back before nginx
# writes the headers, so no body follows them. Without that, nginx sends the POST's
# chunked body after the HEAD's headers and the next answer on the connection starts
# inside it. A HEAD stage followed by a GET stage stays green with that bug, so the
# GET stage's verifier sends HEAD then GET over one connection itself.
stages:
  - name: HEAD of interactions answers 200 with the JSON content type
    request:
      url: "{rewriter_url}/account/ixtester/interactions"
      method: HEAD
      params: {from_date: "2021-03-01", to_date: "2021-03-01", top_n: 10}
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"

  - name: a GET after a HEAD on the same connection is answered whole
    request:
      url: "{rewriter_url}/account/ixtester/interactions"
      method: GET
      params: {from_date: "2021-03-01", to_date: "2021-03-01", top_n: 10}
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:assert_head_then_get_framed
      json:
        - {interaction_type: "reply", partner: "ixalice", interaction_count: 2, partner_rank: 1, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "reply", partner: "ixbob", interaction_count: 1, partner_rank: 2, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "vote", partner: "ixalice", interaction_count: 2, partner_rank: 1, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "vote", partner: "ixbob", interaction_count: 1, partner_rank: 2, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "transfer", partner: "ixbob", interaction_count: 1, partner_rank: 1, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "reblog", partner: "ixalice", interaction_count: 1, partner_rank: 1, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "follow", partner: "ixbob", interaction_count: 2, partner_rank: 1, partners_merged: 1, covered_from: "2021-03-01"}
        - {interaction_type: "follow", partner: "ixcarol", interaction_count: 1, partner_rank: 2, partners_merged: 1, covered_from: "2021-03-01"}
