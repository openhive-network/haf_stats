---
test_name: Network top accounts rejects invalid limit

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Reject zero limit_count
    request:
      url: "{api_url}/rpc/get_network_top_accounts"
      method: GET
      params:
        limit_count: "0"
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
