---
test_name: Network top accounts matches the 5M replay

marks:
  - patterntest

includes:
  - !include ../common.yaml

stages:
  - name: GET /rpc/get_network_top_accounts transfer-volume leaderboard
    request:
      url: "{api_url}/rpc/get_network_top_accounts"
      method: GET
      params:
        metric: "transfer_volume_in"
        from_date: "2016-04-01"
        to_date: "2016-04-30"
        limit_count: "5"
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
