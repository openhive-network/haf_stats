---
test_name: Account financial summary keeps an explicit mid-month from_date as given (issue #156)

marks:
  - synthetic

includes:
  - !include ../common.yaml

# Only the default window is aligned to a period start. pwindow has one incoming transfer of
# 1000 HBD nai on every day of January-February 2020, so January from the 15th holds 17 days
# and February all 29.
stages:
  - name: GET /rpc/get_account_financial_summary for pwindow from 2020-01-15
    request:
      url: "{api_url}/rpc/get_account_financial_summary"
      method: GET
      params:
        account: "pwindow"
        from_date: "2020-01-15"
        to_date: "2020-02-29"
        granularity: "month"
    response:
      status_code: 200
      json:
        - period: "2020-01-01"
          category: "transfer_operation"
          direction: "incoming"
          hive_nai: 0
          hbd_nai: 17000
          vests_nai: 0
          op_count: 17
        - period: "2020-02-01"
          category: "transfer_operation"
          direction: "incoming"
          hive_nai: 0
          hbd_nai: 29000
          vests_nai: 0
          op_count: 29
