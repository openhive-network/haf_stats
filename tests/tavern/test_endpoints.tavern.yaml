---
test_name: Financial summary rejects invalid date format

includes:
  - !include common.yaml

stages:
  - name: GET /rpc/get_account_financial_summary with bad _from date
    request:
      url: "{api_url}/rpc/get_account_financial_summary"
      method: GET
      params:
        _account: "hiveio"
        _from:    "not-a-date"
    response:
      status_code: 400

