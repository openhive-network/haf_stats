---
test_name: Daily active users matches the 5M replay

marks:
  - patterntest

includes:
  - !include ../common.yaml

stages:
  - name: GET /rpc/get_daily_active_users for 2016-04
    request:
      url: "{api_url}/rpc/get_daily_active_users"
      method: GET
      params:
        from_date: "2016-04-01"
        to_date: "2016-04-30"
        granularity: "month"
        operation_types: "all"
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
