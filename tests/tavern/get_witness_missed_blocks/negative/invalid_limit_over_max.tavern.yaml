---
test_name: Witness missed blocks rejects limit_count above the maximum

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Witness missed blocks rejects limit_count above the maximum
    request:
      url: "{api_url}/rpc/get_witness_missed_blocks"
      method: GET
      params:
        limit_count: 1001
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
