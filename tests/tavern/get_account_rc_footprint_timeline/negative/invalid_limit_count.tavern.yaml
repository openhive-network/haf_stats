---
test_name: Account RC footprint timeline rejects out-of-range limit_count

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Reject limit_count below 1
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "hiveio"
        limit_count: 0
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
