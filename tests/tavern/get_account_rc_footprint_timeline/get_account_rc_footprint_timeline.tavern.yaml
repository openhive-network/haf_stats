---
test_name: Account RC footprint timeline lists priced signed ops most-recent-first

marks:
  - synthetic

includes:
  - !include ../common.yaml

# Per-event drill-down over the same on-demand estimate as get_account_rc_footprint (ci_setup
# rctester fixture). One row per op the account SIGNED (account_id = transacting_account_id) and
# non-virtual; the received vote and the virtual producer_reward are excluded. Ordered by
# account_op_seq_no DESC (dense + monotonic with block within an account = timestamp DESC), exposed
# as op_seq for keyset paging: block-6000 vote (seq 8) leads, and within block 5000 the two
# custom_json ops (seq 4,3) precede the two votes (seq 2,1). rc_consumed is the per-op estimate
# rc_avg_cost(op_type, day): vote 97,278,897, custom_json 167,828,015 (2020-06-08 rate, on/before
# 2021-03); SUM = 4*97278897 + 2*167828015 = 724,771,618 = the group_by=op_type aggregate total.
# app is the registry-resolved DApp name (sm_claim_daily starts_with 'sm_' -> "Splinterlands", same
# resolver as group_by=app); custom_json_id keeps the raw id. Both null for votes.
stages:
  - name: full window returns every signed non-virtual event, newest first, with resolved app + op_seq
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-10T00:00:00", block_num: 6000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 8}
        - {timestamp: "2021-03-01T00:01:00", block_num: 5001, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 7}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 4}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 2}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 1}

  - name: limit_count + offset_start page into the middle of the ordered timeline
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        limit_count: 2
        offset_start: 2
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 4}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}

  # Keyset cursor: before_seq=4 returns only events with op_seq < 4 (the same rows offset_start=3
  # would reach), served by the index with no offset walk.
  - name: before_seq keyset cursor returns events older than the cursor
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        before_seq: 4
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 2}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 1}

  - name: op_type_filter drills into a single op-type bucket (the 4 signed votes)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        op_type_filter: "vote_operation"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-10T00:00:00", block_num: 6000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 8}
        - {timestamp: "2021-03-01T00:01:00", block_num: 5001, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 7}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 2}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 1}

  # app_filter resolves the account's json_ids from account_custom_json_daily (rctester seeded with
  # sm_claim_daily -> Splinterlands), then scans the raw op-18 rows for that id set.
  - name: app_filter drills into a single DApp bucket by resolved name (Splinterlands)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        app_filter: "Splinterlands"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 4}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}

  # app_filter for a DApp the account never signed short-circuits via the rollup (no raw op scan).
  - name: app_filter for an app the account never used returns empty (rollup fast-reject)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        app_filter: "Rising Star"
    response:
      status_code: 200
      json: []

  # category_filter drills one registry level up from app_filter: it resolves the account's json_ids
  # to their category (sm_claim_daily -> Splinterlands -> Gaming) via the same rollup candidate-id
  # path, then scans the same op-18 rows. app stays the per-row resolved DApp name.
  - name: category_filter drills into a single registry category bucket (Gaming)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        category_filter: "Gaming"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 4}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}

  # category_filter for a category the account never used short-circuits via the rollup (no op scan).
  - name: category_filter for a category the account never used returns empty (rollup fast-reject)
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        category_filter: "NFTs"
    response:
      status_code: 200
      json: []

  # app_filter + category_filter intersect: Splinterlands IS in Gaming, so the candidate-id set is
  # unchanged and the two sm_claim_daily events are returned.
  - name: app_filter and category_filter combine as an intersection when consistent
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        app_filter: "Splinterlands"
        category_filter: "Gaming"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 4}
        - {timestamp: "2021-03-01T00:00:00", block_num: 5000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 3}

  # Splinterlands is NOT in the NFTs category, so the intersection is empty (no json_id resolves to
  # both) - the rollup fast-reject returns empty without an op scan.
  - name: app_filter and category_filter that disagree intersect to empty
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        app_filter: "Splinterlands"
        category_filter: "NFTs"
    response:
      status_code: 200
      json: []

  # transfer_operation is a valid non-virtual op type in the stub that rctester never signs, so this
  # exercises the resolved-op-type + zero-match scan predicate (ao.op_type_id = _filter_op_type_id),
  # not the unknown-op-type short-circuit.
  - name: op_type_filter for a valid type the account has no events of returns empty
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rctester"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
        op_type_filter: "transfer_operation"
    response:
      status_code: 200
      json: []

  - name: unknown account returns an empty timeline
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "nosuchaccount"
        from_date: "2021-03-01"
        to_date: "2021-03-31"
    response:
      status_code: 200
      json: []

---
test_name: Account RC footprint timeline category_filter drills multi-DApp categories and Uncategorized

marks:
  - synthetic

includes:
  - !include ../common.yaml

# cattester (ci_setup, id 4001) signed three custom_json events in block 4000 (2020-06-01):
# sm_claim_daily -> Splinterlands and risingstar -> Rising Star (BOTH the Gaming category), and
# mystery_cat -> Uncategorized (no registry match). This is the case a single-DApp fixture cannot
# cover: category_filter=Gaming returns rows whose resolved `app` DIFFERS per row, proving the
# app label is resolved per-row (resolve_dapp_name(page.json_id)) and not held at a constant.
# rc_consumed is the per-event estimate rc_avg_cost(18, 2020-06-01) = 167828015; ordered by op_seq
# DESC (3 > 2 > 1).
stages:
  - name: category_filter=Gaming returns both Gaming DApps, each with its own resolved app name
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "cattester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        category_filter: "Gaming"
    response:
      status_code: 200
      json:
        - {timestamp: "2020-06-01T00:00:00", block_num: 4000, op_type: "custom_json_operation", app: "Rising Star", custom_json_id: "risingstar", rc_consumed: 167828015, op_seq: 2}
        - {timestamp: "2020-06-01T00:00:00", block_num: 4000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 1}

  # category_filter=Uncategorized drills into the unmatched-id bucket; app falls back to the raw id.
  - name: category_filter=Uncategorized returns unmatched-id events with the raw id as app
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "cattester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        category_filter: "Uncategorized"
    response:
      status_code: 200
      json:
        - {timestamp: "2020-06-01T00:00:00", block_num: 4000, op_type: "custom_json_operation", app: "mystery_cat", custom_json_id: "mystery_cat", rc_consumed: 167828015, op_seq: 3}

  # op_type_filter=custom_json_operation is consistent with a category_filter (both select op 18),
  # so the contradiction guard must NOT fire - the result equals the plain category_filter=Gaming.
  - name: category_filter combined with op_type_filter=custom_json_operation is not contradictory
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "cattester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        category_filter: "Gaming"
        op_type_filter: "custom_json_operation"
    response:
      status_code: 200
      json:
        - {timestamp: "2020-06-01T00:00:00", block_num: 4000, op_type: "custom_json_operation", app: "Rising Star", custom_json_id: "risingstar", rc_consumed: 167828015, op_seq: 2}
        - {timestamp: "2020-06-01T00:00:00", block_num: 4000, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 167828015, op_seq: 1}

  # #44: per-event EXACT shares for rcexact (ci_setup.sql). The vote of seq 6 sits in a
  # transaction with no rc_cost and keeps the estimate; seq 7's transaction also holds a virtual
  # op, which takes no share and is not listed. SUM = 720,667,325, the group_by=op_type total, so
  # the timeline still reconciles with the aggregate.
  - name: events are priced with their exact share of the transaction's RC cost
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-20"
        to_date: "2021-03-20"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-20T00:00:06", block_num: 6502, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 50000000, op_seq: 7}
        - {timestamp: "2021-03-20T00:00:06", block_num: 6502, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 97278897, op_seq: 6}
        - {timestamp: "2021-03-20T00:00:03", block_num: 6501, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 73388427, op_seq: 5}
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 89878541, op_seq: 4}
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 155060730, op_seq: 3}
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 155060730, op_seq: 2}
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 100000000, op_seq: 1}

  # The app_filter branch reads the raw custom_json ops through a different query; it prices them
  # exactly too.
  - name: app_filter events are priced with their exact share too
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-20"
        to_date: "2021-03-20"
        app_filter: "Splinterlands"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 155060730, op_seq: 3}
        - {timestamp: "2021-03-20T00:00:00", block_num: 6500, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 155060730, op_seq: 2}

  # Day two (block 6503): the remainder of the zero-rate split goes to the higher id (seq 12).
  - name: second-day events, including an even split under a zero rate
    request:
      url: "{api_url}/rpc/get_account_rc_footprint_timeline"
      method: GET
      params:
        account: "rcexact"
        from_date: "2021-03-21"
        to_date: "2021-03-21"
    response:
      status_code: 200
      json:
        - {timestamp: "2021-03-21T00:00:00", block_num: 6503, op_type: "transfer_operation", app: null, custom_json_id: null, rc_consumed: 500001, op_seq: 12}
        - {timestamp: "2021-03-21T00:00:00", block_num: 6503, op_type: "transfer_operation", app: null, custom_json_id: null, rc_consumed: 500000, op_seq: 11}
        - {timestamp: "2021-03-21T00:00:00", block_num: 6503, op_type: "custom_json_operation", app: "Splinterlands", custom_json_id: "sm_claim_daily", rc_consumed: 215243222, op_seq: 10}
        - {timestamp: "2021-03-21T00:00:00", block_num: 6503, op_type: "vote_operation", app: null, custom_json_id: null, rc_consumed: 384756778, op_seq: 9}
