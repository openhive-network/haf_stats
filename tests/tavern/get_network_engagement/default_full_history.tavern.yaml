---
test_name: Network engagement no-date default returns full history (issue #35)

marks:
  - synthetic

includes:
  - !include ../common.yaml

# Regression for #35: with no from_date the endpoint must default to chain genesis (full
# history), consistent with get_network_vote_stats / get_daily_active_users /
# get_network_rc_utilization — NOT the last 30 days. ci_setup seeds engagement_period_counts
# only in 2016-03; a genesis default rolls that into the single 2016-03 month period, whereas
# the old NOW()-30d default would return [] (2016-03 is far outside the last month).
stages:
  - name: GET /rpc/get_network_engagement with no date params returns the historical month
    request:
      url: "{api_url}/rpc/get_network_engagement"
      method: GET
      params:
        granularity: "month"
    response:
      status_code: 200
      json:
        - period: "2016-03-01"
          total_posts: 3
          avg_votes_per_post: 2.67
          avg_comments_per_post: 1.0
          zero_vote_post_pct: 33.33
          zero_comment_post_pct: 33.33
