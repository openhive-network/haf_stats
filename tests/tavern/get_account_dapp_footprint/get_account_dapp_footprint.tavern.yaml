---
test_name: Account DApp footprint classifies custom_json activity into categories

marks:
  - synthetic

includes:
  - !include ../common.yaml

# Reads account_custom_json_daily (ci_setup) and resolves apps/categories from the
# seeded custom_json_app_registry. dapptester in June 2020: sm_claim_daily 25 + sm_battle
# 5 -> Splinterlands/Gaming, ssc-mainnet-hive 20 -> Hive Engine (SSC)/DeFi, follow 10 ->
# Hivemind Follow/Social Graph, mystery_app 5 -> Uncategorized = 65 ops. A 999-op July row
# is outside the range and excluded. rc_estimated is set so RC shares differ from op shares
# (mystery_app: 7.69% of ops but 40% of estimated RC) - proving the RC lens is independent
# of op count. Categories/dapps are ordered by op_count desc.
stages:
  - name: GET /rpc/get_account_dapp_footprint for dapptester, June 2020
    request:
      url: "{api_url}/rpc/get_account_dapp_footprint"
      method: GET
      params:
        account: "dapptester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
    response:
      status_code: 200
      json:
        account: "dapptester"
        from_date: "2020-06-01"
        to_date: "2020-06-30"
        total_ops: 65
        total_rc_estimated: 100000
        top_category: "Gaming"
        top_dapp: "Splinterlands"
        categories:
          - category: "Gaming"
            op_count: 30
            pct: 46.15
            rc_estimated: 30000
            rc_pct: 30.00
          - category: "DeFi"
            op_count: 20
            pct: 30.77
            rc_estimated: 20000
            rc_pct: 20.00
          - category: "Social Graph"
            op_count: 10
            pct: 15.38
            rc_estimated: 10000
            rc_pct: 10.00
          - category: "Uncategorized"
            op_count: 5
            pct: 7.69
            rc_estimated: 40000
            rc_pct: 40.00
        dapps:
          - category: "Gaming"
            app_name: "Splinterlands"
            op_count: 30
            pct: 46.15
            rc_estimated: 30000
            rc_pct: 30.00
          - category: "DeFi"
            app_name: "Hive Engine (SSC)"
            op_count: 20
            pct: 30.77
            rc_estimated: 20000
            rc_pct: 20.00
          - category: "Social Graph"
            app_name: "Hivemind Follow"
            op_count: 10
            pct: 15.38
            rc_estimated: 10000
            rc_pct: 10.00
          - category: "Uncategorized"
            app_name: "mystery_app"
            op_count: 5
            pct: 7.69
            rc_estimated: 40000
            rc_pct: 40.00
