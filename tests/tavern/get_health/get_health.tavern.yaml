---
test_name: Health endpoint returns ok status

includes:
  - !include ../common.yaml

stages:
  - name: GET /rpc/get_health
    request:
      url: "{api_url}/rpc/get_health"
      method: GET
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"
      json:
        - status: "ok"
          last_processed_block: !anything
          version: !anything
