---
test_name: Network vote stats rejects invalid date format

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Reject malformed to_date
    request:
      url: "{api_url}/rpc/get_network_vote_stats"
      method: GET
      params:
        to_date: "not-a-date"
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
