---
test_name: Network account funnel returns exact independent retention windows

marks:
  - patterntest
  - synthetic

includes:
  - !include ../common.yaml

stages:
  - name: Mid-month dates include the corresponding January cohort
    request:
      url: "{api_url}/rpc/get_network_account_funnel"
      method: GET
      params:
        from_date: "2020-01-15"
        to_date: "2020-01-20"
    response:
      status_code: 200
      headers:
        content-type: "application/json; charset=utf-8"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
