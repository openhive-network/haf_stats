---
test_name: Network top custom_json rejects invalid order_by

marks:
  - patterntest
  - negative

includes:
  - !include ../../common.yaml

stages:
  - name: Reject unsupported order_by
    request:
      url: "{api_url}/rpc/get_network_top_custom_json"
      method: GET
      params:
        order_by: "rc_total"
    response:
      status_code: 400
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
        extra_kwargs:
          error_response: true
