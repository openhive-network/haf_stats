name: 'haf_stats-test'

# =============================================================================
# Cached-test stack — HAF (--skip-hived) + PostgREST only.
# =============================================================================
# Used by the pattern-test / regression-test CI jobs (COMPOSE_FILE override).
# Unlike docker-compose.yml there is no install/processing here: the datadir bind
# mounted from ${HAF_DATA_DIRECTORY} is the haf_haf_stats_sync NFS cache, which
# already holds the installed schema and fully processed data. HAF just serves it
# read-side and PostgREST exposes the endpoints. Mirrors
# balance_tracker/docker/docker-compose-test.yml.
#
# ci.env (generated by the .haf_app_dind_compose_startup template) provides
# HAF_IMAGE_NAME, POSTGREST_IMAGE, HAF_DATA_DIRECTORY, HAF_SHM_DIRECTORY and the
# PGRST_* values auto-derived from HAF_APP_ROLE_PREFIX=haf_stats.

services:
  haf:
    image: ${HAF_IMAGE_NAME:-registry.gitlab.syncad.com/hive/haf/instance:latest}
    entrypoint: /home/hived/docker_entrypoint.sh
    command: ["--skip-hived"]
    environment:
      DATADIR: /home/hived/datadir
      SHM_DIR: /home/hived/shm_dir
      PGCTLTIMEOUT: 600
      PG_ACCESS: "
        host    all    all    all    trust\n
        "
    ports:
      - "5432:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./blockchain:/home/hived/datadir/blockchain
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
    networks:
      - haf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haf_admin -d haf_block_log"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgrest:
    image: ${POSTGREST_IMAGE:-registry.gitlab.syncad.com/hive/haf_api_node/postgrest:latest}
    ports:
      - "3000:3000"
    environment:
      # See docker-compose.yml: options= carries the API statement_timeout. (#48)
      PGRST_DB_URI:                      ${PGRST_DB_URI:-postgresql://haf_stats_owner@haf:5432/haf_block_log?options=-c%20statement_timeout%3D30s}
      PGRST_DB_SCHEMA:                   ${PGRST_DB_SCHEMA:-haf_stats_endpoints}
      PGRST_DB_ANON_ROLE:                ${PGRST_DB_ANON_ROLE:-haf_stats_user}
      PGRST_DB_EXTRA_SEARCH_PATH:        ${PGRST_DB_EXTRA_SEARCH_PATH:-haf_stats_app}
      PGRST_DB_POOL:                     ${PGRST_DB_POOL:-20}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_ACQUISITION_TIMEOUT:-10}
    networks:
      - haf-network
    depends_on:
      haf:
        condition: service_healthy

  # Re-install over the already-installed cache datadir (#74). Behind a profile so
  # `docker compose up` (what .haf_app_dind_compose_startup runs for every other test
  # job) never starts it -- only `docker compose run haf-stats-setup` does, which
  # activates the profile implicitly. Without the profile this would install on every
  # pattern-test and regression-test run too, changing what those lanes measure.
  #
  # The datadir here is the haf_haf_stats_sync cache: a database that already has the
  # full schema installed. Running install_app against it is precisely the operation
  # #60 broke, and the one no CI lane performed until this service existed.
  # PARITY: docker/docker-compose.yml declares the deployment copy of this service
  # and is the source of truth for its command/environment. Nothing asserts the two
  # stay in step, so a variable added there (--swagger-url, POSTGRES_PORT, ...) and
  # not here would leave this lane testing a different install than operators run.
  haf-stats-setup:
    profiles: ["reinstall"]
    # NOT `:?`, and NOT a real published tag. Both are wrong here:
    #
    #   `:?`  breaks the SIBLING lanes. Compose interpolates the WHOLE file at `config`
    #         and `up` time -- `profiles:` gates whether a service STARTS, not whether
    #         its definition is interpolated -- so pattern-test and regression-test,
    #         which use this file and never set HAF_STATS_IMAGE, fail before starting
    #         anything. (Learned the hard way: pipeline 178863.)
    #   a real tag (e.g. haf_stats:latest) would let reinstall-test go GREEN having
    #         installed a DIFFERENT commit, which is the one outcome that makes the
    #         whole lane worthless.
    #
    # So: a default that interpolates cleanly for everyone but cannot resolve as an
    # image. Siblings never pull it; reinstall-test sets the real value and, if it ever
    # stopped doing so, dies on a pull whose name says exactly what went wrong.
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-reinstall-test-job:invalid}
    # Mirrors docker-compose.yml's setup, including --swagger-url. The comment above
    # warns that nothing asserts the two stay in step; #70 added this flag there, so it
    # is added here too rather than becoming the first instance of that drift.
    command: ["install_app", "--swagger-url=/"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # matches docker-compose.yml: install creates roles/context
      POSTGRES_DB:   haf_block_log
    networks:
      - haf-network
    depends_on:
      haf:
        condition: service_healthy

networks:
  haf-network:
    name: haf-network-test

volumes:
  haf_datadir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_DATA_DIRECTORY:-/tmp/haf_stats_data}
  haf_shmdir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_SHM_DIRECTORY:-/tmp/haf_stats_shm}
