name: 'haf_stats-test'

# =============================================================================
# Cached-test stack — HAF (--skip-hived) + PostgREST only.
# =============================================================================
# Used by the pattern-test / regression-test CI jobs (COMPOSE_FILE override).
# Unlike docker-compose.yml there is no install/processing here: the datadir bind
# mounted from ${HAF_DATA_DIRECTORY} is the haf_haf_stats_sync NFS cache, which
# already holds the installed schema and fully processed data. HAF just serves it
# read-side and PostgREST exposes the endpoints. Mirrors
# balance_tracker/docker/docker-compose-test.yml.
#
# ci.env (generated by the .haf_app_dind_compose_startup template) provides
# HAF_IMAGE_NAME, POSTGREST_IMAGE, HAF_DATA_DIRECTORY, HAF_SHM_DIRECTORY and the
# PGRST_* values auto-derived from HAF_APP_ROLE_PREFIX=haf_stats.

services:
  haf:
    image: ${HAF_IMAGE_NAME:-registry.gitlab.syncad.com/hive/haf/instance:latest}
    entrypoint: /home/hived/docker_entrypoint.sh
    command: ["--skip-hived"]
    environment:
      DATADIR: /home/hived/datadir
      SHM_DIR: /home/hived/shm_dir
      PGCTLTIMEOUT: 600
      PG_ACCESS: "
        host    all    all    all    trust\n
        "
    ports:
      - "5432:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./blockchain:/home/hived/datadir/blockchain
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
    networks:
      - haf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haf_admin -d haf_block_log"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgrest:
    image: ${POSTGREST_IMAGE:-registry.gitlab.syncad.com/hive/haf_api_node/postgrest:latest}
    ports:
      - "3000:3000"
    environment:
      # See docker-compose.yml: options= carries the API statement_timeout. (#48)
      PGRST_DB_URI:                      ${PGRST_DB_URI:-postgresql://haf_stats_owner@haf:5432/haf_block_log?options=-c%20statement_timeout%3D30s}
      PGRST_DB_SCHEMA:                   ${PGRST_DB_SCHEMA:-haf_stats_endpoints}
      PGRST_DB_ANON_ROLE:                ${PGRST_DB_ANON_ROLE:-haf_stats_user}
      PGRST_DB_EXTRA_SEARCH_PATH:        ${PGRST_DB_EXTRA_SEARCH_PATH:-haf_stats_app}
      PGRST_DB_POOL:                     ${PGRST_DB_POOL:-20}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_ACQUISITION_TIMEOUT:-10}
    networks:
      - haf-network
    depends_on:
      haf:
        condition: service_healthy

networks:
  haf-network:
    name: haf-network-test

volumes:
  haf_datadir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_DATA_DIRECTORY:-/tmp/haf_stats_data}
  haf_shmdir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_SHM_DIRECTORY:-/tmp/haf_stats_shm}
