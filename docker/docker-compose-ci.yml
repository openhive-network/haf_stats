version: "3.8"

# CI test stack — plain postgres (no HAF replay needed).
# Runs only validation and explicitly synthetic edge cases against seeded data.
# Real-data value correctness belongs to docker-compose-test.yml.
#
# hafd schema is mocked via tests/ci_setup.sql so endpoint functions that
# join against hafd.accounts / hafd.operation_types can exercise deterministic
# empty and error paths without pretending to validate mainnet values.
# get_network_hp_distribution reads the precomputed hp_distribution_snapshot;
# missing btracker_app is handled in refresh_hp_distribution_snapshot (the
# information_schema probe leaves the snapshot empty -> endpoint returns []).
#
# Do NOT use --abort-on-container-exit — the setup container exits normally
# after running SQL, which would abort postgrest before tavern finishes.
# Use detached mode + "docker compose wait tavern" instead (see run_tests.sh).

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: haf_block_log
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haf_block_log"]
      interval: 3s
      timeout: 2s
      retries: 20

  setup:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_setup.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_block_range.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_account_cohorts.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /cohort_fixture.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_community_registry.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_content_stats.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /community_fixture.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /hivemind_oracle_fixture.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /mainnet_community_fixture.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /community_vs_hivemind.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_witness_blocks.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /witness_fixture.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /seed_data.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_governance_concentration.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "SELECT haf_stats_app.refresh_governance_concentration();" &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /process_hp_distribution.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "SELECT haf_stats_app.refresh_hp_distribution_snapshot();" &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /sync_status.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "SET custom.swagger_url = 'localhost';" -f /endpoint_schema.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL TABLES IN SCHEMA haf_stats_backend TO haf_stats_user; GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA haf_stats_endpoints TO haf_stats_user;" &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /interactions_cap.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_privileges.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /op_type_registry.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_op_types.sql
    volumes:
      - ../tests/ci_setup.sql:/ci_setup.sql:ro
      # #55: the SECURITY DEFINER over hafd.contexts, plus the privilege/source probes
      # that run last (they need the endpoints and grants to already exist).
      - ../db/sync_status.sql:/sync_status.sql:ro
      - ../tests/ci_privileges.sql:/ci_privileges.sql:ro
      - ../db/process_block_range.sql:/process_block_range.sql:ro
      - ../tests/cohort_fixture.sql:/cohort_fixture.sql:ro
      # The community path (#47) is unreachable on the real 2016 replay, so the stub gate
      # loads its REAL processors and runs them over synthetic post-37.5M ops.
      - ../db/process_community_registry.sql:/process_community_registry.sql:ro
      - ../db/process_content_stats.sql:/process_content_stats.sql:ro
      - ../tests/community_fixture.sql:/community_fixture.sql:ro
      # A hivemind_app test double, so the oracle's dynamic-SQL path is not dead code
      # until it first runs on a production node that co-locates hivemind. Loaded BEFORE
      # the mainnet fixture, which mirrors its real nodes into the same stub.
      - ../tests/hivemind_oracle_fixture.sql:/hivemind_oracle_fixture.sql:ro
      # Real mainnet threads replayed as raw ops, checked against hivemind's own verdict.
      - ../tests/mainnet_community_fixture.sql:/mainnet_community_fixture.sql:ro
      - ../tests/parity/community_vs_hivemind.sql:/community_vs_hivemind.sql:ro
      # Executes the op-ceiling guard, which no tavern test can reach (the corpus is far
      # below any sane ceiling), so the truncation path does not ship unexecuted.
      - ../tests/parity/interactions_cap.sql:/interactions_cap.sql:ro
      # #54 witness rollup. Unlike the operation-stream processors this one reads only
      # hafd.blocks plus one virtual op type, so the fast lane can run the REAL processor
      # over synthetic blocks instead of hand-seeding its output table.
      - ../db/process_witness_blocks.sql:/process_witness_blocks.sql:ro
      - ../tests/witness_fixture.sql:/witness_fixture.sql:ro
      - ../db/seed_data.sql:/seed_data.sql:ro
      - ../db/process_account_cohorts.sql:/process_account_cohorts.sql:ro
      - ../db/process_governance_concentration.sql:/process_governance_concentration.sql:ro
      - ../db/process_hp_distribution.sql:/process_hp_distribution.sql:ro
      - ../endpoints/endpoint_schema.sql:/endpoint_schema.sql:ro
      # #56: the op-type dependency registry and its assertion. Loaded LAST so the assertion's
      # drift scan sees every processor AND the endpoints. The registry is only ever run here by
      # ci_op_types.sql, which patches it per arm inside a rolled-back transaction: the stub's
      # hafd.operation_types has 7 rows with deliberately non-mainnet ids, so the shipped
      # registry cannot pass against it. The stub lane never runs install_app.sh, so this is the
      # only place the assertion's failure arms are executed at all.
      - ../db/op_type_registry.sql:/op_type_registry.sql:ro
      - ../tests/ci_op_types.sql:/ci_op_types.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "postgres://postgres:postgres@postgres/haf_block_log"
      PGRST_DB_SCHEMA: "haf_stats_endpoints"
      PGRST_DB_ANON_ROLE: "haf_stats_user"
      PGRST_DB_POOL: "5"
    depends_on:
      setup:
        condition: service_completed_successfully

  # The rewriter, built from the SHIPPED Dockerfile.rewriter -- not a stand-in. Until
  # now no lane started it, so endpoints/rewrite_rules.conf was built into an image and
  # never requested: a removed, mis-ordered or typo'd rule shipped green while every
  # public URL 404'd. It also means Dockerfile.rewriter itself had never run anywhere.
  #
  # Scope, stated precisely, because the artifact and the container have different
  # reaches: what this proves is that every rule in endpoints/rewrite_rules.conf --
  # the file production bind-mounts into its own (balance_tracker-derived) nginx --
  # resolves to a live /rpc/ function. It does NOT cover that container's server
  # block, nor the HAProxy path in front of it.
  rewriter:
    build:
      context: ..
      dockerfile: Dockerfile.rewriter
    environment:
      POSTGREST_HOST: postgrest
      POSTGREST_PORT: 3000
      # nginx's access_log records the ORIGINAL request line, so without this a
      # routing failure shows up as `GET /version ... 404` with no indication of
      # what it rewrote to -- which is the one fact you need. Costs nothing in a
      # throwaway CI container.
      REWRITE_LOG: "on"
    # The image already ships a dedicated health server on port 81 (see
    # docker/haf_stats_nginx.conf.template) that nothing was using. Every other
    # dependency in this file waits on a condition; these two were the only
    # short-form ones, and short form waits for container START, not readiness.
    # tavern spends 20-40s in `pip install` before its first request so the race is
    # unlikely, but "unlikely" is how flakes are described before they happen.
    healthcheck:
      # Same probe haf_api_node uses for the sibling rewriter images
      # (balance_tracker.yaml, hafah.yaml, haf_block_explorer.yaml all run exactly
      # this against port 81 of an openresty image from the same family), so wget
      # is known present.
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    depends_on:
      postgrest:
        condition: service_started

  tavern:
    image: python:3.12-slim
    # Pin pytest<9: pytest 9 dropped _pytest._code.code.FormattedExcinfo, which
    # tavern 3.6.0 imports, so an unpinned install breaks collection at import time.
    command: >
      sh -c "pip install tavern 'pytest<9' -q &&
             pytest /tests/tavern -m 'negative or synthetic' --tb=short -v"
    volumes:
      - ../tests/tavern:/tests/tavern:ro
    environment:
      API_URL: "http://postgrest:3000"
      # The one place this variable carries a REAL address. The two other
      # declarations (.gitlab-ci.yml, docker-compose-test.yml) are collection-only
      # placeholders pointing at a deliberately unresolvable host, so if this
      # service is ever renamed those lanes fail fast instead of quietly passing.
      REWRITER_URL: "http://rewriter"
      PYTHONPATH: "/tests/tavern"
      TAVERN_DIR: "/tests/tavern"
    depends_on:
      postgrest:
        condition: service_started
      rewriter:
        condition: service_healthy
