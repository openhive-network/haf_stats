version: "3.8"

# Full production stack:
#   haf            — HAF PostgreSQL node (hived + sql_serializer)
#   haf-stats-setup     — One-time schema installation
#   haf-stats-process   — Infinite block-processing loop
#   haf-stats-api       — PostgREST REST API

services:
  haf:
    image: ${HAF_REGISTRY}/haf/instance:${HAF_VERSION}
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      HIVED_CHAIN_STATE_SIZE_LIMIT: "1073741824"
    volumes:
      - haf_datadir:/home/hived/datadir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U haf_admin -d haf_block_log"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 72h   # replay can take days on first run

  haf-stats-setup:
    image: ${HAF_STATS_REGISTRY}/haf_stats:${HAF_STATS_VERSION}
    command: ["/app/scripts/install_app.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # install runs as haf_admin to create roles
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf:
        condition: service_healthy
    restart: on-failure

  haf-stats-process:
    image: ${HAF_STATS_REGISTRY}/haf_stats:${HAF_STATS_VERSION}
    command: ["/app/scripts/process_blocks.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf-stats-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "psql -h haf -U haf_stats_user -d haf_block_log -c 'SELECT 1' -q"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 72h

  haf-stats-api:
    image: postgrest/postgrest:${POSTGREST_VERSION}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      PGRST_DB_URI:            "postgres://haf_stats_user@haf/haf_block_log"
      PGRST_DB_SCHEMA:         "haf_stats_endpoints"
      PGRST_DB_ANON_ROLE:      "haf_stats_user"
      PGRST_DB_POOL:           "20"
      PGRST_DB_POOL_TIMEOUT:   "10"
      PGRST_SERVER_TIMING_ENABLED: "true"
    depends_on:
      haf-stats-process:
        condition: service_healthy

volumes:
  haf_datadir:
