name: 'haf_stats'

# =============================================================================
# haf_stats full stack — HAF + schema install + block processing + PostgREST.
# =============================================================================
# This is the production stack: `cd docker && docker compose up -d` brings up the
# pinned HAF image from docker/.env and runs a normal hived replay/sync.
#
# It is also template-shaped to plug into the shared common-ci-configuration
# pipeline (see .gitlab-ci.yml). CI does NOT use these production defaults — it
# overlays overrides/ci.yml (sync) / uses docker-compose-ci-test.yml (tests),
# which inject the find_haf_image instance image (HAF_IMAGE_NAME) and run
# --skip-hived against the datadir prepare_haf_data caches once per HAF commit, and
# redirect the datadir/shm named volumes to bind mounts (HAF_DATA_DIRECTORY /
# HAF_SHM_DIRECTORY) so the synced state can be tar'd into the NFS cache.

services:
  haf:
    # CI passes HAF_IMAGE_NAME (the find_haf_image instance image); production
    # falls back to the pinned image from docker/.env (HAF_REGISTRY + HAF_VERSION).
    image: ${HAF_IMAGE_NAME:-${HAF_REGISTRY:-registry.gitlab.syncad.com/hive}/haf:${HAF_VERSION:-1.28.6}}
    entrypoint: /home/hived/docker_entrypoint.sh
    # Production runs HAF_COMMAND from docker/.env (a real replay incl.
    # --shared-file-size); see the note there. CI's sync/test stacks override this
    # with --skip-hived. Do NOT hardcode --skip-hived here, or a fresh
    # `docker compose up -d` would start against an empty, non-replayed datadir.
    command: ${HAF_COMMAND:-}
    environment:
      DATADIR: /home/hived/datadir
      SHM_DIR: /home/hived/shm_dir
      PG_ACCESS: "
        host    haf_block_log    haf_stats_user     all    trust\n
        host    haf_block_log    haf_stats_owner    all    trust\n
        host    haf_block_log    haf_admin          all    trust\n
        "
    ports:
      - "${HAF_PORT:-5432}:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./blockchain:/home/hived/datadir/blockchain
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL", "/home/hived/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h   # time for replay to finish on a fresh sync

  haf-stats-setup:
    image: ${HAF_STATS_IMAGE:-${HAF_STATS_REGISTRY:-registry.gitlab.syncad.com/hive}/haf_stats:${HAF_STATS_VERSION:-latest}}
    # A verb, not a path (#57) -- the image's entrypoint dispatches it. Spelled this
    # way here, rather than only in a future module file, so the reference stack uses the
    # same form a module would. Note what that does NOT buy: compose-validate only runs
    # `docker compose config`, which parses YAML and never starts a container. Nothing in
    # CI executes the dispatcher inside the image except the docker-build smoke tests.
    command: ["install_app"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # install runs as haf_admin to create roles/context
      POSTGRES_DB:   haf_block_log
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy

  haf-stats-process:
    image: ${HAF_STATS_IMAGE:-${HAF_STATS_REGISTRY:-registry.gitlab.syncad.com/hive}/haf_stats:${HAF_STATS_VERSION:-latest}}
    command: ["process_blocks"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      POSTGRES_DB:   haf_block_log
    networks:
      haf-network:
    # Declared here rather than in the Dockerfile -- see the note there. This is the only
    # service the check describes; the other two built from the same image run once and
    # exit.
    #
    # What it replaces: `psql -U haf_stats_user ... -c 'SELECT 1'`, which proved
    # PostgreSQL answers and said nothing about whether haf_stats_app.main() was still
    # advancing. It also connected as haf_stats_user, which db/builtin_roles.sql creates
    # NOINHERIT *where it creates the role at all* -- on a HAF-provisioned node the role
    # is INHERIT and in hive_applications_owner_group. What actually hides hafd.contexts
    # from it is RLS, not inheritance: builtin_roles.sql grants SELECT on hafd directly.
    # (An earlier revision of this comment gave the mechanism as NOINHERIT.) So
    # cannot read hafd.contexts at all -- harmless for SELECT 1, fatal for any real check.
    #
    # start_period covers a first run against a fresh HAF, which replays in MASSIVE
    # iterations; the heartbeat does not move until an iteration finishes, so a long batch
    # can exceed MAX_AGE on a replay that is perfectly healthy. 72h is inherited from the
    # SELECT 1 check and is NOT a considered number for the new one: Docker >= 25 ends the
    # start period at the first success, so it does not in fact cover a whole replay. Left
    # alone because tuning it without a measured MASSIVE batch duration would be
    # guessing twice. NOTE: haf-stats-api's depends_on was relaxed from service_healthy
    # to service_started in the same change -- an earlier revision of this comment
    # claimed "nothing yet consumes this service's health", which was false fifteen
    # lines below its own text.
    healthcheck:
      test: ["CMD", "/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 72h
    depends_on:
      haf-stats-setup:
        condition: service_completed_successfully

  # Removes haf_stats from the database: HAF context, all three schemas (CASCADE), both
  # roles. Behind a profile, so `docker compose up` never starts it.
  #
  #     docker compose -f docker/docker-compose.yml stop haf-stats-process haf-stats-api
  #     docker compose -f docker/docker-compose.yml run --rm haf-stats-uninstall
  #
  # USE `run --rm`, NOT `--profile haf-stats-uninstall up`. Upstream documents the `up`
  # form and it is safe THERE because upstream puts every app service behind a profile
  # too. In THIS file nothing else has `profiles:`, so `up` would also start
  # haf-stats-setup -- whose command is `install_app` -- concurrently with the teardown,
  # racing DROP SCHEMA against CREATE SCHEMA, and restart the very services the operator
  # was just told to stop. The session guard cannot see it either: haf-stats-setup
  # connects as haf_admin, and the guard counts only haf_stats_owner/haf_stats_user.
  # `run` starts only this service and its depends_on.
  #
  # --force is passed so the run is non-interactive; `docker compose run` does allocate a
  # TTY, so dropping it would make the script prompt. Run scripts/uninstall_app.sh
  # directly without --force to get the type-the-database-name confirmation.
  #
  # DESTRUCTIVE AND IRREVERSIBLE -- haf_stats_backend holds the rollups, which only a
  # full reprocess rebuilds.
  haf-stats-uninstall:
    profiles: ["haf-stats-uninstall"]
    image: ${HAF_STATS_IMAGE:-${HAF_STATS_REGISTRY:-registry.gitlab.syncad.com/hive}/haf_stats:${HAF_STATS_VERSION:-latest}}
    command: ["uninstall_app", "--force"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # dropping roles needs more than haf_stats_owner
      POSTGRES_DB:   haf_block_log
    networks:
      haf-network:
    depends_on:
      # Without this, `run --rm haf-stats-uninstall` against a stopped stack does not
      # start haf and sits in wait_for_postgres -- an unbounded `until pg_isready` loop --
      # forever, with no message.
      haf:
        condition: service_healthy

  haf-stats-api:
    image: ${POSTGREST_IMAGE:-${POSTGREST_REGISTRY:-postgrest/postgrest}:${POSTGREST_VERSION:-v12.2.3}}
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Auto-configured by the common-ci templates from HAF_APP_ROLE_PREFIX=haf_stats
      # (owner role connects for schema introspection, anon role serves requests);
      # the defaults keep a plain `docker compose up` working outside CI.
      # statement_timeout rides on PostgREST's CONNECTION, not on a role and not on the
      # function. A `SET statement_timeout` function attribute never arms (the timer is set
      # before the statement begins), and role config is ignored under SET ROLE - PostgREST
      # logs in as haf_stats_owner and switches to haf_stats_user per request, so an
      # ALTER ROLE haf_stats_user would be dead config here. This bounds API queries only;
      # the block processor uses its own connection and is deliberately unaffected. (#48)
      PGRST_DB_URI:                      ${PGRST_DB_URI:-postgresql://haf_stats_owner@haf:5432/haf_block_log?options=-c%20statement_timeout%3D30s}
      PGRST_DB_SCHEMA:                   ${PGRST_DB_SCHEMA:-haf_stats_endpoints}
      # Without this, GET / serves PostgREST's own auto-generated introspection
      # document instead of the curated spec in haf_stats_endpoints.root(), and the
      # rewriter's `rewrite ^/$ /` rule is inert. Seven of the nine peer modules in
      # haf_api_node set it (hafah uses `home`; hivemind's line is commented out)
      # (balance_tracker.yaml, reputation_tracker.yaml). It was absent from this
      # repo entirely -- the live node only served the right document because the
      # private node config set it. (#61)
      PGRST_DB_ROOT_SPEC:                ${PGRST_DB_ROOT_SPEC:-root}
      PGRST_DB_ANON_ROLE:                ${PGRST_DB_ANON_ROLE:-haf_stats_user}
      PGRST_DB_EXTRA_SEARCH_PATH:        ${PGRST_DB_EXTRA_SEARCH_PATH:-haf_stats_app}
      PGRST_DB_POOL:                     ${PGRST_DB_POOL:-20}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_ACQUISITION_TIMEOUT:-10}
      PGRST_SERVER_TIMING_ENABLED:       "true"
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy
      haf-stats-process:
        # service_started, NOT service_healthy. This gate predates #57, but #57 changed
        # what "healthy" MEANS: from `SELECT 1` (true the moment Postgres answers) to a
        # committed block-processing iteration. Left as service_healthy, PostgREST would
        # not start until the app had finished a MASSIVE batch -- and by this MR's own
        # admission a long batch can exceed the window indefinitely, so on a fresh node
        # it might never start. `start_period: 72h` makes it worse, not better: the
        # container reports `starting` rather than `healthy`, so the gate never releases.
        #
        # Upstream does not couple these at all -- balance_tracker.yaml's postgrest
        # depends on its install job and pgbouncer, never on block-processing. Serving
        # slightly stale statistics is better than serving none.
        condition: service_started

  # The public REST surface. Without this service `docker compose up -d` gives bare
  # PostgREST, where every documented path -- /network/engagement,
  # /account/{account}/interactions -- 404s, because they only exist as rewrite rules
  # mapping them onto /rpc/ calls. The image, its nginx template, its entrypoint and
  # endpoints/rewrite_rules.conf all already existed and CI built and pushed the image
  # on every commit; THIS file, the one operators run, never started it. (#61)
  #
  # docker-compose-ci.yml has built and run this Dockerfile since #62, with
  # tests/tavern/rewriter/public_paths.tavern.yaml exercising all 24 rules against it, so
  # the ROUTING was already proven. What was missing was only that an operator following
  # this repo's README got PostgREST and no rewriter.
  #
  # Service shape copied from the deployment that proves it: POSTGREST_HOST/PORT are the
  # only two knobs the entrypoint reads, and the healthcheck probes :81, which is a
  # SEPARATE server block in the image serving only /health. Do not point it at :80/health
  # -- that path is a rewrite rule reaching get_health in the database, so it would report
  # the APP healthy rather than the PROXY alive.
  #
  # OPERATIONAL NOTE: haf_stats_nginx.conf.template becomes a literal
  # `proxy_pass http://haf-stats-api:3000` with no `resolver` directive, so nginx resolves
  # that name ONCE at startup and caches the IP. Recreating haf-stats-api (an image bump,
  # --force-recreate) gives it a new IP and this container keeps serving 502s against the
  # old one -- while reporting healthy, because the :81 probe is an unconditional 204 that
  # never touches the upstream. Restart the rewriter after anything that recreates the API.
  haf-stats-rewriter:
    # One version for both images, matching haf_api_node/haf_stats.yaml, which pins this
    # image at ${HAF_STATS_VERSION}. A second knob that must always be moved with the
    # first is not a knob -- it is a skew waiting to happen.
    image: ${HAF_STATS_REWRITER_IMAGE:-${HAF_STATS_REGISTRY:-registry.gitlab.syncad.com/hive}/haf_stats/rewriter:${HAF_STATS_VERSION:-latest}}
    build:
      # So `docker compose build` works from a clone, which is how a developer will
      # reach this service before any image exists for their commit.
      context: ..
      dockerfile: Dockerfile.rewriter
    # Deliberately NO `restart:` key. No other service in this file has one, and both
    # scripts/install_app.sh and README.md state that as fact while explaining why a
    # missing --is_forking is a WARN rather than a failure. A restart policy on the proxy
    # alone would falsify those two comments and leave a restarting proxy in front of a
    # dead PostgREST. If this stack wants restart policies it should get them everywhere,
    # as its own change.
    ports:
      # The rewriter is the front door; haf-stats-api stays published on 3000 for raw
      # /rpc/ access and for anyone already depending on it.
      - "${REWRITER_PORT:-3001}:80"
    environment:
      POSTGREST_HOST: ${POSTGREST_HOST:-haf-stats-api}
      POSTGREST_PORT: ${POSTGREST_PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    networks:
      haf-network:
    depends_on:
      haf-stats-api:
        condition: service_started

networks:
  haf-network:
    name: haf-network

volumes:
  haf_datadir:
    driver: local
  haf_shmdir:
    driver: local
