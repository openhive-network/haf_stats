# Tuned hived config for local replay testing.
# Reduces chainbase from 7G (default) to 4G to fit within Docker's WSL2 memory limit.
# P2P seed nodes are omitted — replay reads from block_log, no network needed.

log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_microseconds"} {"appender":"p2p","file":"logs/hived/p2p/p2p.log","truncate":false,"time_format":"iso_8601_milliseconds", "rotation_interval": 86400, "rotation_limit": 2592000} {"appender": "default", "file": "logs/hived/default/default.log","truncate":false, "time_format": "iso_8601_milliseconds", "rotation_interval": 86400, "rotation_limit": 2592000}

log-logger = {"name":"default","level":"info","appenders":["stderr", "default"]} {"name":"user","level":"debug","appenders":["stderr", "default"]} {"name":"p2p","level":"warn","appenders":["p2p"]}

plugin = metadata node_status_api account_by_key account_by_key_api block_api condenser_api database_api json_rpc market_history market_history_api network_broadcast_api p2p rc_api state_snapshot transaction_status transaction_status_api wallet_bridge_api webserver

# --- Replay-speed tuning ---
shared-file-size = 4G
psql-wal-queue-depth = 1000
flush-state-interval = 100000

# --- Live-sync isolation (no P2P, tolerate PG/chainbase inconsistency from crash) ---
p2p-max-connections = 0
psql-force-open-inconsistent = true
