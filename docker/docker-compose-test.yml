version: "3.8"

# Fast test stack — skips hived, loads a pre-synced block_log snapshot.
# Use for CI and local development: no multi-day blockchain replay needed.
#
# Usage:
#   docker compose -f docker-compose-test.yml up --abort-on-container-exit

services:
  haf:
    image: ${HAF_REGISTRY}/haf/instance:${HAF_VERSION}
    command: >
      /home/hived/run_hived.sh
      --skip-hived
      --psql-url="host=localhost dbname=haf_block_log user=haf_admin"
    ports:
      - "5432:5432"
    volumes:
      - ./blockchain:/home/hived/datadir/blockchain:ro   # pre-synced block_log
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U haf_admin -d haf_block_log"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m

  haf-stats-setup:
    image: ${HAF_STATS_REGISTRY}/haf_stats:${HAF_STATS_VERSION}
    command: ["/app/scripts/install_app.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf:
        condition: service_healthy

  haf-stats-process:
    image: ${HAF_STATS_REGISTRY}/haf_stats:${HAF_STATS_VERSION}
    command: ["/app/scripts/process_blocks.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_stats_owner
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf-stats-setup:
        condition: service_completed_successfully

  haf-stats-api:
    image: postgrest/postgrest:${POSTGREST_VERSION}
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI:       "postgres://haf_stats_user@haf/haf_block_log"
      PGRST_DB_SCHEMA:    "haf_stats_endpoints"
      PGRST_DB_ANON_ROLE: "haf_stats_user"
      PGRST_DB_POOL:      "5"
    depends_on:
      - haf-stats-process

  tavern:
    image: python:3.12-slim
    command: >
      sh -c "pip install tavern -q &&
             pytest /tests/tavern --tb=short -v"
    volumes:
      - ../tests/tavern:/tests/tavern:ro
    environment:
      API_URL: "http://haf-stats-api:3000"
    depends_on:
      - haf-stats-api
