# The REAL scripts/install_app.sh against a REAL PostgreSQL, in seconds. (#84)
#
# WHY THIS LANE EXISTS. Every other lane that runs `install_app.sh` needs a REPLAYED
# HAF -- `sync` starts haf-stats-setup, and `reinstall-test` compose-runs it but is gated
# behind sync, which alone takes 6-9 minutes on top of find_haf_image and
# prepare_haf_data. Everything cheaper tests something adjacent instead --
#
#   tests/unit/*            runs the script against a STUB psql that exits 0 for
#                           everything, so it can assert what the script SENDS and never
#                           what PostgreSQL does with it. It passed on SQL the server
#                           cannot parse.
#   docker-compose-ci.yml   has a real PostgreSQL but psql's the SQL files DIRECTLY; it
#                           never runs the installer, and says so in its own comments. It
#                           also never attempts db/haf_stats_app.sql or
#                           db/builtin_roles.sql at all.
#
# A failure only a real server shows -- e.g. `:'var'` is not substituted under `psql -c`,
# only under -f and stdin -- would otherwise need a replayed HAF to surface. This lane is
# stub database, real script, seconds.
#
# WHAT IT DELIBERATELY DOES NOT COVER. No block processing -- tests/ci_haf_stub.sql
# is context bookkeeping only, not a HAF emulator. Op-type assertion is skipped (see the
# install service). Chain-data correctness stays with `sync` and the tavern suites.

# Its own project name. Both this file and docker-compose-ci.yml live in docker/, so both
# would otherwise default to the Compose project `docker` AND both define a service called
# `postgres` -- harmless in CI (a fresh dind per job) but locally `down -v` here would take
# volumes belonging to a running endpoint-tests stack.
name: haf_stats_ci_install

# THE DEFAULT BELOW IS DELIBERATELY UNRESOLVABLE. #66 publishes `latest` on every green
# develop pipeline, so a default of haf_stats:latest would let an unset HAF_STATS_IMAGE
# install DEVELOP HEAD and go green -- a lane passing against a different commit than the
# one under test, which is the one outcome that makes it worthless.
#
# docker-compose-ci-test.yml already reasons this way and uses the same shape; see
# its comment on haf-stats-image-not-set-by-reinstall-test-job:invalid.
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haf_block_log
    healthcheck:
      # -h localhost, not the default. Without it pg_isready probes the UNIX SOCKET,
      # which postgres binds before it accepts TCP -- and every dependent service here
      # connects over TCP to `postgres:5432`. The gap is small but it is a real race, and
      # a healthcheck that passes before the thing it gates is reachable is the kind of
      # flake that gets retried rather than read.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d haf_block_log"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The HAF that isn't there. ci_setup.sql is reused verbatim -- it is already proven to
  # let every db/ and endpoints/ file load -- and the shim adds the context API the
  # installer needs that it does not provide, plus the HAF-provided roles it grants into.
  #
  # THE TWO CLEANUP STATEMENTS ARE LOAD-BEARING, and for the same reason: ci_setup.sql is
  # written for the endpoint-tests lane, where it SUBSTITUTES for an install. Here the
  # install must do that work itself, or the lane verifies ci_setup's output instead.
  #
  # Dropping the three schemas is what de-vacuates most of ci_install_verify.sql. With
  # them present, ci_setup.sql had already created all three, seeded app_status and
  # app_config, and set ALTER DEFAULT PRIVILEGES granting haf_stats_user SELECT and
  # USAGE -- so "3 schemas exist", "app_config has one row", "the anon role can read it"
  # and the USAGE check all passed with an installer that did nothing at all.
  #
  # Dropping the two APP ROLES is the same de-vacuation applied to db/builtin_roles.sql.
  # ci_setup.sql creates haf_stats_owner and haf_stats_user, then ALTERs the owner to
  # INHERIT and GRANTs it hive_applications_owner_group -- so builtin_roles' CREATE ROLE
  # arms never ran, and its hard install-time assertion that haf_stats_owner holds
  # hive_applications_group was satisfied by the FIXTURE regardless of what the installer
  # did. Without the drop, the group grant could be deleted from db/builtin_roles.sql and
  # this lane would stay green, while /sync-status answers 503 on a healthy node.
  #
  # DROP OWNED BY first, because the roles hold grants and ALTER DEFAULT PRIVILEGES
  # entries that DROP ROLE alone refuses to step over. In a file rather than inline
  # because DROP OWNED BY raises 42704 on a role that does not exist, so it needs a guard
  # -- and because a two-statement `psql -c` reports only the last command tag, which
  # made the drop invisible in the job log. Safe here and only here: roles are
  # CLUSTER-wide, and this is a throwaway postgres container with nothing else in it.
  #
  # THE BYSTANDER CONTEXT is planted for the opposite reason: to prove the teardown is
  # SCOPED. With only haf_stats in hafd.contexts, "the haf_stats context is gone" and
  # "hafd.contexts was emptied" are the same observation. ci_bystander_app is owned by a
  # different role, so uninstall_app.sh's own guard cannot claim it, and
  # tests/ci_uninstall_verify.sql asserts it is still there afterwards.
  #
  # ci_setup.sql pre-seeds a haf_stats context at block 6000
  # for the /sync-status tavern stages. Leaving it there means
  # create_context_if_not_exists() takes its "already exists" branch, so the installer
  # never calls hive.app_create_context at all -- the lane would run green having
  # exercised none of context CREATION, which is the step it exists to cover. Removing the
  # row makes install #1 take the create path and install #2 take the repair path, so the
  # pair covers both.
  db-setup:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_setup.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_haf_stub.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_reset_app.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "INSERT INTO hafd.contexts (name, owner, current_block_num, irreversible_block, is_attached, is_forking, app_schema) VALUES ('ci_bystander_app', 'hive_applications_group', 0, 0, FALSE, FALSE, 'ci_bystander_app')" 
    volumes:
      - ../tests/ci_setup.sql:/ci_setup.sql:ro
      - ../tests/ci_haf_stub.sql:/ci_haf_stub.sql:ro
      - ../tests/ci_reset_app.sql:/ci_reset_app.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # HAF_STATS_SKIP_OP_TYPE_ASSERT, set on every install service below: the assertion
  # compares hafd.operation_types against db/op_type_registry.sql, and ci_setup.sql seeds 5
  # rows (ids 1, 2, 18, 64, 86) with deliberately NON-mainnet ids so the shipped registry
  # cannot pass against it by construction. Note the flag DOWNGRADES the assertion's three
  # fatal arms to a WARNING rather than skipping the function: assert_op_types still runs
  # ten times here (install_app.sh calls it twice, in each of the five installs). What is
  # never exercised is its ABORT. The failure arms are covered by tests/ci_op_types.sql in
  # the endpoint-tests lane; running it here would only assert that a stub disagrees with
  # mainnet.
  #
  # THE BASELINE INSTALL -- what a real node is upgrading FROM. (#78)
  #
  # WHY THIS EXISTS. reinstall-test installs the SAME image twice, so it is an
  # idempotency guard, not an upgrade guard, and the one class it cannot reach is the
  # one #73 exists to prevent: `ERROR: cannot change return type of existing function`.
  # CREATE OR REPLACE of an UNCHANGED signature is already idempotent, so a second
  # install of the same commit exits 0 whether or not #73's nine DROPs are present --
  # delete all nine and that lane still goes green. This pair is what covers them.
  #
  # BASELINE SQL FROM GIT, NOT A BASELINE IMAGE such as ${CI_REGISTRY_IMAGE}:<develop-sha>:
  # a git checkout does not depend on a tag surviving registry cleanup, and has no "skip
  # loudly when the image cannot be pulled" path that could itself go quiet.
  # .gitlab-ci.yml extracts the merge target's db/, endpoints/ and scripts/ into
  # .baseline/ before the stack starts.
  #
  # scripts/ IS MOUNTED TOO, and that is not optional. install_app.sh loads its SQL files
  # BY NAME; mounting only the baseline's db/ under the CURRENT script breaks the moment
  # a commit adds a file -- which is exactly the kind of commit this lane exists to test.
  # With scripts/ mounted this is the baseline application, running in the current
  # image's userland.
  #
  # NOT DONE IN reinstall-test. That lane's datadir comes from sync
  # with the CURRENT schema already installed (docker-compose-ci-test.yml says so), so a
  # baseline install there is a DOWNGRADE -- and if this commit legitimately changed a
  # return type, the downgrade hits the very error under test, in reverse, turning the
  # lane red for a backward-incompatibility nobody asked for. Here db-setup has already
  # wiped the schemas, the context row and the app roles, so the baseline install starts
  # from nothing and the upgrade is genuine.
  #
  # version.sql is generated into /app/db at BUILD time, so mounting over that directory
  # hides it. install_app.sh already guards on its existence and skips; the app_version
  # row simply stays whatever the current install writes later.
  install-baseline:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["install_app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
      HAF_STATS_SKIP_OP_TYPE_ASSERT: "1"
    volumes:
      - ../.baseline/db:/app/db:ro
      - ../.baseline/endpoints:/app/endpoints:ro
      - ../.baseline/scripts:/app/scripts:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # THE UPGRADE UNDER TEST: this commit's SQL, over the baseline's. Its SUCCESS is the
  # assertion -- `ERROR: cannot change return type of existing function` surfaces here and
  # nowhere else in this repo's CI.
  install-upgrade:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["install_app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
      HAF_STATS_SKIP_OP_TYPE_ASSERT: "1"
    depends_on:
      install-baseline:
        condition: service_completed_successfully

  # BACK TO A CLEAN SLATE, and this service is the reason the rest of the lane still
  # means anything.
  #
  # Without it, install-baseline takes the create path and `install` takes the "already
  # exists" early return -- so every assertion about what an install CREATES (the context
  # owner, is_forking/is_attached, the three schemas, swagger_base_url, and
  # db/builtin_roles.sql's CREATE ROLE arms) is satisfied by the MERGE TARGET rather than
  # by the commit under test, and passes either way.
  #
  # With it, the upgrade check above is a self-contained PHASE and everything below runs
  # from scratch. Coverage is added, not traded.
  reset-app:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_reset_app.sql
    volumes:
      - ../tests/ci_reset_app.sql:/ci_reset_app.sql:ro
    depends_on:
      install-upgrade:
        condition: service_completed_successfully

  # Install #1 of the ORIGINAL chain: this commit's SQL, from nothing. Everything
  # ci_install_verify.sql asserts about what an install CREATES is defended here.
  install:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["install_app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
      HAF_STATS_SKIP_OP_TYPE_ASSERT: "1"
    depends_on:
      reset-app:
        condition: service_completed_successfully

  # Between the installs: prove #1 seeded the pointer, then move app_status ahead of the
  # context so #2 has something to repair.
  #
  # Without this, install #2 would take the `_ctx_block >= _seed` early return and never
  # call app_context_is_attached or app_set_current_block_num. hive_state.consistent_block
  # is 6000, so a 5000 app_status clamps to 5000 rather than being rejected, and the final
  # pointer becomes a number only hive.app_set_current_block_num can have produced.
  seed-repair:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_seed_repair.sql
    volumes:
      - ../tests/ci_seed_repair.sql:/ci_seed_repair.sql:ro
    depends_on:
      install:
        condition: service_completed_successfully

  # UNDO all 17 guarded upgrades, so the next install runs the statement inside every one. (#96)
  #
  # Without it this lane would run the DDL of only one of them: comment_registry.community's
  # ADD COLUMN, which a fresh install needs because the CREATE TABLE lacks the column. Every
  # other guard met a table that was already upgraded, so a typo in its DDL -- or a catalog
  # test that is wrongly always-FALSE -- would ship green. install-again redoes all 17, and
  # ci_install_verify.sql asserts each one. See tests/ci_break_schema.sql for the list.
  break-schema:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_break_schema.sql
    volumes:
      - ../tests/ci_break_schema.sql:/ci_break_schema.sql:ro
    depends_on:
      seed-repair:
        condition: service_completed_successfully

  # Install #2. A shim that quietly does nothing looks identical to a working one after a
  # single run; the second run is where that shows up, because create_context_if_not_exists
  # has to READ the state the first run wrote.
  #
  # It takes the REPAIR branch, because seed-repair above arranged for it to: the context
  # is at 0 and app_status is at 5000, so `_ctx_block >= _seed` is false. The job log
  # shows it: `install-again-1 | WARNING: HAF context haf_stats repaired: block 0 -> 5000`.
  #
  # It and install-under-lock are the only places the installer's own idempotency is exercised
  # against a real server outside the replayed-HAF lanes (sync carries an explicit timeout:
  # 2h; reinstall-test inherits the project's 3600s).
  install-again:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["install_app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
      HAF_STATS_SKIP_OP_TYPE_ASSERT: "1"
    depends_on:
      break-schema:
        condition: service_completed_successfully

  # A READER, holding what a live API request holds. (#96)
  #
  # The db/ files carry one-time ALTER TABLE upgrades for deployments that predate a column or
  # a constraint. ALTER TABLE takes ACCESS EXCLUSIVE BEFORE it evaluates IF [NOT] EXISTS, so on
  # a node where the upgrade already happened an unguarded one still asks for a lock that
  # conflicts with every SELECT -- and readers arriving after it queue behind that request.
  # This session takes ACCESS SHARE on the six migrated tables and watches pg_locks until
  # install-under-lock is past every migrating file; it fails if a request that queues readers
  # appears, or if no install gets that far within 90 s. See tests/ci_lock_holder.sql.
  #
  # The healthcheck is what makes the race deterministic: install-under-lock is gated on the
  # locks being HELD, not merely on this container having started.
  lock-holder:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_lock_holder.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -Atc \"SELECT COUNT(DISTINCT relation) = 8 FROM pg_locks WHERE mode = 'AccessShareLock' AND granted AND relation IN ('haf_stats_backend.account_financial_daily'::regclass, 'haf_stats_backend.active_users_daily'::regclass, 'haf_stats_backend.comment_registry'::regclass, 'haf_stats_backend.account_custom_json_daily'::regclass, 'haf_stats_backend.account_cohort_retention'::regclass, 'haf_stats_backend.author_cohort_retention'::regclass, 'haf_stats_backend.network_op_daily'::regclass, 'haf_stats_backend.network_custom_json_daily'::regclass)\" | grep -qx t"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ../tests/ci_lock_holder.sql:/ci_lock_holder.sql:ro
    depends_on:
      install-again:
        condition: service_completed_successfully

  # Install #3 of the original chain, run WHILE that reader holds its locks. On a database where
  # every upgrade has already been applied -- which is what install-again leaves -- a guarded
  # install takes no conflicting lock and finishes normally.
  #
  # Through tests/ci_install_no_upgrade.sh, which runs the same install_app verb and then fails if
  # any guarded upgrade RAN. The holder only sees the guards whose DDL takes ACCESS EXCLUSIVE; the
  # DELETE and the VALIDATE in db/process_financial.sql queue no reader, so a guard wrongly TRUE
  # on either is invisible to it. `bash` because the entrypoint execs anything runnable.
  install-under-lock:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["bash", "/ci_install_no_upgrade.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
      HAF_STATS_SKIP_OP_TYPE_ASSERT: "1"
    volumes:
      - ../tests/ci_install_no_upgrade.sh:/ci_install_no_upgrade.sh:ro
    depends_on:
      lock-holder:
        condition: service_healthy

  # Teardown. This is the only place CI runs uninstall_app.sh AGAINST A DATABASE
  # (tests/unit/test_uninstall_app.py stubs psql, so it never reaches a server). It costs
  # ~2s here, and it is also what makes hive.app_remove_context in the shim live code
  # rather than a function whose only caller is the shim's own self-test.
  #
  # --force because there is no TTY; uninstall_app.sh refuses the interactive confirmation
  # without it.
  uninstall:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["uninstall_app", "--force"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
    depends_on:
      verify:
        condition: service_completed_successfully
      driver-retry:
        condition: service_completed_successfully

  # #123: while hivemind is behind a range, the installed process_blocks raises 55R23 at once,
  # the haf_app_driver.py this image ships rolls the range back and retries it, and the legacy
  # main() loop retries it outside a transaction. The only lane with both the installed app and
  # the shipped driver; the stub has no block streaming, so the script stands in
  # hive.app_next_iteration for its own duration and undoes everything it set up.
  driver-retry:
    image: ${HAF_STATS_IMAGE:-haf-stats-image-not-set-by-install-test-job:invalid}
    command: ["python3", "/ci_driver_hivemind_retry.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: haf_block_log
      PGPASSWORD: postgres
    volumes:
      - ../tests/ci_driver_hivemind_retry.py:/ci_driver_hivemind_retry.py:ro
    depends_on:
      verify:
        condition: service_completed_successfully

  # uninstall_app.sh runs scripts/uninstall_verify.sql itself and reports survivors, but it
  # is permissive by design -- it pushes past errors the way upstream teardowns do. So
  # assert independently that nothing survived, including the HAF context, which
  # uninstall_verify.sql deliberately cannot name in a FROM clause.
  verify-gone:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_uninstall_verify.sql
    volumes:
      - ../tests/ci_uninstall_verify.sql:/ci_uninstall_verify.sql:ro
    depends_on:
      uninstall:
        condition: service_completed_successfully

  verify:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    # Four psql sessions. The second and third must be LOGINS as haf_stats_user and as
    # haf_stats_owner: role settings are applied at login, not on SET ROLE, so a superuser
    # session cannot prove what PostgREST or the block processor gets.
    # ci_install_verify.sql gives both roles the CI-only password those use. (#94)
    #
    # The fourth runs the installed all-time refresh and, over two more dblink connections,
    # checks that a haf_stats_user reader and the installed endpoint do not wait 2 s for a lock
    # during it, and that a second refresh does wait (#95). It runs last and rolls itself back.
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_install_verify.sql
        && PGPASSWORD=ci-login-probe psql -h postgres -U haf_stats_user -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_login_timeout.sql
        && PGPASSWORD=ci-login-probe psql -h postgres -U haf_stats_owner -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_login_timeout.sql
        && PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_alltime_refresh.sql
    volumes:
      - ../tests/ci_install_verify.sql:/ci_install_verify.sql:ro
      - ../tests/ci_login_timeout.sql:/ci_login_timeout.sql:ro
      - ../tests/ci_alltime_refresh.sql:/ci_alltime_refresh.sql:ro
    depends_on:
      # Both: the install that ran under a reader's lock, and the reader itself -- its verdict
      # (no conflicting lock request appeared) is delivered by its exit code. (#96)
      install-under-lock:
        condition: service_completed_successfully
      lock-holder:
        condition: service_completed_successfully
