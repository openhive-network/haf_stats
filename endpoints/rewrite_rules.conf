# nginx rewrite rules — auto-generated from OpenAPI annotations in endpoint_schema.sql.
# Run scripts/openapi_rewrite.sh to regenerate after changing endpoint paths.
# Specific rules must precede the default catch-all (first match wins in nginx).

# endpoint for get /network/vote-stats
rewrite ^/network/vote-stats$ /rpc/get_network_vote_stats break;

# endpoint for get /network/daily-active-users
rewrite ^/network/daily-active-users$ /rpc/get_daily_active_users break;

# endpoint for get /network/account-funnel
rewrite ^/network/account-funnel$ /rpc/get_network_account_funnel break;

# endpoint for get /network/hp-distribution
rewrite ^/network/hp-distribution$ /rpc/get_network_hp_distribution break;

# endpoint for get /network/rc-utilization
rewrite ^/network/rc-utilization$ /rpc/get_network_rc_utilization break;

# endpoint for get /account/{_account}/rc-footprint
rewrite ^/account/([^/]+)/rc-footprint$ /rpc/get_account_rc_footprint?_account=$1 break;

# endpoint for get /account/{_account}/content-stats
rewrite ^/account/([^/]+)/content-stats$ /rpc/get_account_content_stats?_account=$1 break;

# endpoint for get /account/{_account}/financial-summary
rewrite ^/account/([^/]+)/financial-summary$ /rpc/get_account_financial_summary?_account=$1 break;

# endpoint for get /health
rewrite ^/health$ /rpc/get_health break;

# endpoint for get /version
rewrite ^/version$ /rpc/get_version break;

# endpoint for openapi spec itself
rewrite ^/$ / break;

# default endpoint for everything else
rewrite ^/(.*)$ /rpc/$1 break;
