# nginx rewrite rules — auto-generated from OpenAPI annotations in endpoint_schema.sql.
# Run scripts/openapi_rewrite.sh to regenerate after changing endpoint paths.
# Specific rules must precede the default catch-all (first match wins in nginx).

# endpoint for get /network/top-accounts
rewrite ^/network/top-accounts$ /rpc/get_network_top_accounts break;

# endpoint for get /network/engagement
rewrite ^/network/engagement$ /rpc/get_network_engagement break;

# endpoint for get /network/content-volume
rewrite ^/network/content-volume$ /rpc/get_network_content_volume break;

# endpoint for get /network/vote-stats
rewrite ^/network/vote-stats$ /rpc/get_network_vote_stats break;

# endpoint for get /network/daily-active-users
rewrite ^/network/daily-active-users$ /rpc/get_daily_active_users break;

# endpoint for get /network/author-retention
rewrite ^/network/author-retention$ /rpc/get_network_author_retention break;

# endpoint for get /network/account-funnel
rewrite ^/network/account-funnel$ /rpc/get_network_account_funnel break;

# endpoint for get /governance/influence-concentration
rewrite ^/governance/influence-concentration$ /rpc/get_governance_influence_concentration break;

# endpoint for get /network/hp-distribution
rewrite ^/network/hp-distribution$ /rpc/get_network_hp_distribution break;

# endpoint for get /network/top-custom-json
rewrite ^/network/top-custom-json$ /rpc/get_network_top_custom_json break;

# endpoint for get /network/custom-json-usage
rewrite ^/network/custom-json-usage$ /rpc/get_network_custom_json_usage break;

# endpoint for get /network/rc-utilization
rewrite ^/network/rc-utilization$ /rpc/get_network_rc_utilization break;

# endpoint for get /custom-json-app-registry
rewrite ^/custom-json-app-registry$ /rpc/get_custom_json_app_registry break;

# endpoint for get /account/{account}/dapp-footprint
rewrite ^/account/([^/]+)/dapp-footprint$ /rpc/get_account_dapp_footprint?account=$1 break;

# endpoint for get /account/{account}/rc-footprint-timeline
rewrite ^/account/([^/]+)/rc-footprint-timeline$ /rpc/get_account_rc_footprint_timeline?account=$1 break;

# endpoint for get /account/{account}/rc-footprint
rewrite ^/account/([^/]+)/rc-footprint$ /rpc/get_account_rc_footprint?account=$1 break;

# endpoint for get /account/{account}/interactions
rewrite ^/account/([^/]+)/interactions$ /rpc/get_account_interactions?account=$1 break;

# endpoint for get /account/{account}/community-activity
rewrite ^/account/([^/]+)/community-activity$ /rpc/get_account_community_activity?account=$1 break;

# endpoint for get /account/{account}/content-stats
rewrite ^/account/([^/]+)/content-stats$ /rpc/get_account_content_stats?account=$1 break;

# endpoint for get /account/{account}/financial-summary
rewrite ^/account/([^/]+)/financial-summary$ /rpc/get_account_financial_summary?account=$1 break;

# endpoint for get /sync-status
rewrite ^/sync-status$ /rpc/get_sync_status break;

# endpoint for get /health
rewrite ^/health$ /rpc/get_health break;

# endpoint for get /version
rewrite ^/version$ /rpc/get_version break;

# endpoint for openapi spec itself
rewrite ^/$ / break;

# default endpoint for everything else
rewrite ^/(.*)$ /rpc/$1 break;
