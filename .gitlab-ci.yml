# =============================================================================
# haf_stats CI — cached-replay pipeline (adopted from balance_tracker).
# =============================================================================
# The heavy 5M-block replay is paid ONCE per HAF commit and cached on NFS, then
# the app sync runs only the schema install + block processing on top of that
# pre-replayed datadir and caches the result. Test jobs extract the cache and
# start a HAF (--skip-hived) + PostgREST stack in seconds instead of re-replaying.
#
# Flow (mirrors balance_tracker):
#   detect : find_haf_image  -> HAF image/commit
#            detect_changes   -> AUTO_SKIP_SYNC when only docs/tests changed
#   build  : prepare_haf_data -> replay 5M once, cache as `haf` (per HAF commit)
#            docker-build      -> build+push this commit's haf_stats image
#   sync   : sync             -> install + process to head, cache `haf_haf_stats_sync`
#   test   : pattern-test      -> tavern .pat.json exact-value suite (cached stack)
#            regression-test    -> parity + external hived regression guards
#   cleanup: cache_cleanup     -> manual NFS cache pruning
#
# The fast stub gate (endpoint-tests, docker-compose-ci.yml) still runs on every
# push and needs no replay.
# =============================================================================

stages:
  - detect
  - lint
  - build
  - sync
  - test
  - cleanup

variables:
  # ---------------------------------------------------------------------------
  # App identity — drives the common-ci .haf_app_* templates:
  #   APP_SYNC_CACHE_TYPE = haf_${HAF_APP_NAME}_sync = haf_haf_stats_sync
  #   roles/schema derived from HAF_APP_ROLE_PREFIX: haf_stats_owner /
  #   haf_stats_user / haf_stats_endpoints / haf_stats_app.
  # ---------------------------------------------------------------------------
  # Present ONLY so tavern can COLLECT tests/tavern/rewriter/ in every lane.
  # Tavern resolves an include's variables while collecting the file, which
  # happens before pytest applies -m, so pattern-test -- which deselects those
  # tests via `not synthetic` and never starts a rewriter -- still died on the
  # unresolvable variable, taking the whole suite with it.
  #
  # .invalid is reserved by RFC 2606 and guaranteed never to resolve. That is the
  # point: this value must never be reachable. If a mark is ever dropped and one
  # of these tests actually RUNS in a lane with no rewriter, it fails immediately
  # with NXDOMAIN. A plausible name like "http://rewriter" could resolve through a
  # runner's DNS search suffix, and nothing here sets a request timeout, so the
  # lane would hang until the job limit instead.
  #
  # The real address lives in docker/docker-compose-ci.yml, on the one service
  # that runs these tests against a rewriter that is actually up.
  REWRITER_URL: "http://rewriter.invalid"

  HAF_APP_NAME: "haf_stats"
  HAF_APP_ROLE_PREFIX: "haf_stats"
  HAF_APP_SCHEMA: "haf_stats_app"

  # Cache configuration. APP_CACHE_KEY pins both the HAF commit (HAF_COMMIT, from
  # find_haf_image) and this app commit, so any change to either invalidates it.
  APP_SYNC_CACHE_TYPE: "haf_haf_stats_sync"
  APP_CACHE_KEY: "${HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: "/blockchain/block_log_5m"
  REPLAY_STOP_AT_BLOCK: "5000000"

  # Skip the heavy sync when only docs/tests/CI-yaml changed (detect_changes).
  HAF_APP_SKIP_PATTERNS: '^tests/|^docs/|\.md$|^README|^CHANGELOG|^LICENSE|^CLAUDE|^\.gitlab-ci\.yml$'

  # QUICK_TEST=true + QUICK_TEST_HAF_COMMIT=<sha> reuses an existing cache and
  # skips the replay/sync entirely (manual iteration).
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""
  AUTO_SKIP_SYNC: "false"

  # Pin common-ci-configuration so template/script drift can't silently break CI.
  COMMON_CI_REF: "96889a650b3f45244cecc4bb3f250af439a71900"
  COMMON_CI_URL: "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/${COMMON_CI_REF}"
  CACHE_MANAGER: "/tmp/cache-manager.sh"
  CACHE_MANAGER_REF: "96889a650b3f45244cecc4bb3f250af439a71900"

  # Centralized runner image with Docker + psql. NOTE: pytest/tavern are NOT
  # preinstalled — the common-ci .tavern_install_deps script pip-installs them
  # into docker/venv (see pattern-test below).
  HAF_APP_TEST_RUNNER_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:2.2"
  # Per-build network so DinD job containers can reach the compose services.
  FF_NETWORK_PER_BUILD: "true"
  GIT_SUBMODULE_STRATEGY: "none"

include:
  - template: Workflows/Branch-Pipelines.gitlab-ci.yml
  # Pinned to a SHA (not develop) for reproducibility — bump deliberately.
  - project: 'hive/common-ci-configuration'
    ref: 96889a650b3f45244cecc4bb3f250af439a71900
    file:
      - '/templates/base.gitlab-ci.yml'
      - '/templates/docker_image_jobs.gitlab-ci.yml'
      - '/templates/haf_data_preparation.gitlab-ci.yml'
      - '/templates/cache_cleanup.gitlab-ci.yml'
      - '/templates/test_jobs.gitlab-ci.yml'
      - '/templates/haf_app_testing.gitlab-ci.yml'
      - '/templates/source_change_detection.gitlab-ci.yml'

# =============================================================================
# DETECT
# =============================================================================
find_haf_image:
  extends: .find_haf_image
  stage: detect
  variables:
    UPSTREAM_BRANCH: "develop"
    HAF_PATTERNS_REF: "develop"
    # A registry miss must not take the whole pipeline down (haf_stats#51, upstream
    # hive/haf#335). The template's 25-commit develop walk stays the preferred path; the
    # step below handles the miss it would otherwise die on, and still fails hard when
    # nothing at all resolves — so we never export an image name that cannot be pulled.
    UPSTREAM_REQUIRE_HIT: "false"
    # Tried in order, ONLY when no develop commit image resolves. `latest` and `stable` are
    # pointers upstream maintains, so this list keeps working even once retention purges the
    # numbered releases too (it purged the per-commit images that caused #51). Keep the
    # numbered tags in step with docker/.env's HAF_VERSION when you bump either.
    HAF_FALLBACK_TAGS: "latest stable 1.28.7 1.28.6"
    # Set true on a manual pipeline to exercise the fallback without waiting for an outage.
    HAF_FORCE_FALLBACK: "false"
    # Only used if hive/haf's source-patterns.sh becomes unfetchable (see before_script).
    HAF_DEFAULT_SOURCE_PATTERNS: "src/,hive/,cmake/,CMakeLists.txt,Dockerfile,Dockerfile.sql-overlay,docker/,scripts/haf/,scripts/maintenance-scripts/,scripts/setup_ubuntu.sh,scripts/generate_extension_sql.sh,common_includes/,.gitmodules"
  # Same three steps as .find_haf_image's before_script, except the source-patterns fetch is
  # not fatal. Upstream exits 1 when HAF_PATTERNS_REF is "develop" and the file cannot be
  # fetched, which would kill this job before the fallback below ever runs — and hive/haf
  # moving that file is the same class of upstream churn that caused #51. A stale pattern
  # list only changes which commits the walk considers, so degrading is strictly better.
  before_script:
    - |
      PATTERNS_URL="https://gitlab.syncad.com/hive/haf/-/raw/${HAF_PATTERNS_REF}/scripts/ci-helpers/source-patterns.sh"
      echo "Fetching HAF source patterns from: $PATTERNS_URL"
      UPSTREAM_PATTERNS="$(curl -sf "$PATTERNS_URL" | sh || true)"
      if [ -z "$UPSTREAM_PATTERNS" ] && [ "$HAF_PATTERNS_REF" != "develop" ]; then
        echo "WARNING: HAF_PATTERNS_REF '$HAF_PATTERNS_REF' not found, falling back to develop"
        UPSTREAM_PATTERNS="$(curl -sf "https://gitlab.syncad.com/hive/haf/-/raw/develop/scripts/ci-helpers/source-patterns.sh" | sh || true)"
      fi
      if [ -z "$UPSTREAM_PATTERNS" ]; then
        UPSTREAM_PATTERNS="$HAF_DEFAULT_SOURCE_PATTERNS"
        echo "WARNING: could not fetch source-patterns.sh from HAF; using this repo's pinned copy."
        echo "         If this persists, hive/haf moved the file and the list needs refreshing."
      fi
      echo "Loaded patterns: $UPSTREAM_PATTERNS"
      export UPSTREAM_PATTERNS
    - |
      if [ -n "$HAF_IMAGE_TYPE" ]; then
        export UPSTREAM_IMAGE="$HAF_IMAGE_TYPE"
        echo "Looking for HAF $HAF_IMAGE_TYPE image"
      else
        echo "Looking for HAF mainnet image"
      fi
    - |
      if [ -n "$HAF_IMAGE_TYPE" ]; then
        export UPSTREAM_OUTPUT="haf_${HAF_IMAGE_TYPE}_image.env"
      else
        export UPSTREAM_OUTPUT="haf_image.env"
      fi
  script:
    - !reference [.find_haf_image, script]
    - |
      # Registry retention purged every per-commit develop image in July 2026 while HAF
      # develop itself sat frozen, so all 25 candidates 404'd and this job — and with it
      # every job that needs: it — stayed red for ~12 days (haf_stats#51 / hive/haf#335).
      # Prefer the develop image; fall back only when there is genuinely nothing to find.
      #
      # Residual: the referenced step above can still exit non-zero on its own (a failed
      # clone of hive/haf, or no commit matching the source patterns), and set -e kills the
      # job there, before this runs. Those mean "cannot even ask the question", unlike the
      # empty-registry case this handles.
      PREFIX="${HAF_VAR_PREFIX:-HAF}"
      ENV_FILE="${UPSTREAM_OUTPUT:-haf_image.env}"
      # Fail closed: the flag has to be there and be explicit. If upstream renames it (those
      # scripts are fetched from an unpinned develop ref) we must not read the absence as a
      # miss and silently serve the fallback on every run from then on.
      STATE="$(grep -m1 "^${PREFIX}_UPSTREAM_CACHE_HIT=" "$ENV_FILE" 2>/dev/null | cut -d= -f2- || true)"
      if [ "${HAF_FORCE_FALLBACK}" != "true" ] && [ "$STATE" != "true" ] && [ "$STATE" != "false" ]; then
        echo "ERROR: $ENV_FILE has no usable ${PREFIX}_UPSTREAM_CACHE_HIT line (got: '${STATE}')."
        echo "       The upstream resolver changed its output; this job's fallback logic needs updating."
        exit 1
      fi
      if [ "${HAF_FORCE_FALLBACK}" != "true" ] && [ "$STATE" = "true" ]; then
        echo "find_haf_image: resolved a develop commit image; no fallback needed."
      else
        if [ "${HAF_FORCE_FALLBACK}" = "true" ]; then
          echo "HAF_FORCE_FALLBACK=true - exercising the fallback path deliberately."
        else
          echo "WARNING: no develop commit image for any of the last ${UPSTREAM_MAX_SEARCH} source commits."
        fi
        echo "         Falling back, newest first: ${HAF_FALLBACK_TAGS}"
        BASE="${UPSTREAM_REGISTRY}"
        if [ -n "${UPSTREAM_IMAGE:-}" ]; then BASE="${UPSTREAM_REGISTRY}/${UPSTREAM_IMAGE}"; fi
        RESOLVED=""
        for TAG in ${HAF_FALLBACK_TAGS}; do
          REF="${BASE}:${TAG}"
          # One probe answers both "does it exist" and "what is its digest". Resolving the
          # digest is mandatory, not best-effort: HAF_COMMIT is the replay cache key, so a
          # mutable tag as the key would let a datadir replayed by one HAF version be served
          # to a stack running another, with nothing able to detect it. A tag we cannot pin
          # is therefore skipped, not accepted.
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            # Second source, in case buildx is absent or too old for --format.
            DIGEST="$(docker manifest inspect --verbose "$REF" 2>/dev/null | grep -o 'sha256:[0-9a-f]\{64\}' | head -1 || true)"
          fi
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "  skip: $REF (absent, or no verifiable digest)"
            continue
          fi
          IMAGE="${BASE}@${DIGEST}"
          # Key the cache by the commit the image was BUILT from, not by the tag: that is the
          # same key the develop walk uses, so falling back to an image the walk would have
          # picked anyway reuses its replay cache instead of stranding a second multi-GB copy.
          REV="$(docker buildx imagetools inspect "$REF" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          if printf '%s' "$REV" | grep -qE '^[0-9a-f]{40}$'; then
            KEY="$REV"
          else
            KEY="${TAG}_$(printf '%s' "${DIGEST#sha256:}" | cut -c1-12)"
            echo "  note: no revision label on $REF; keying the cache by digest instead"
          fi
          echo "  hit:  $REF -> $IMAGE (${PREFIX}_COMMIT=$KEY)"
          {
            echo "${PREFIX}_UPSTREAM_BRANCH=${UPSTREAM_BRANCH}"
            # Upstream's own flag means "an older develop COMMIT was used" — a benign timing
            # race. Ours means "no develop image existed at all". Keep them distinct so a
            # surrender to a release tag is visible downstream and in the dotenv artifact.
            echo "${PREFIX}_UPSTREAM_FALLBACK=false"
            echo "${PREFIX}_UPSTREAM_TAG_FALLBACK=true"
            echo "${PREFIX}_UPSTREAM_CACHE_HIT=true"
            echo "${PREFIX}_UPSTREAM_COMMIT=${KEY}"
            echo "${PREFIX}_UPSTREAM_TAG=${TAG}"
            echo "${PREFIX}_UPSTREAM_IMAGE=${IMAGE}"
            echo "${PREFIX}_UPSTREAM_REGISTRY=${BASE}"
            echo "${PREFIX}_IMAGE_NAME=${IMAGE}"
            echo "${PREFIX}_COMMIT=${KEY}"
          } > "$ENV_FILE"
          RESOLVED="$TAG"
          break
        done
        if [ -z "$RESOLVED" ]; then
          echo "ERROR: no develop commit image and no fallback tag resolved - cannot continue."
          exit 1
        fi
        echo "Variables in $ENV_FILE:"
        cat "$ENV_FILE"
      fi

# Inherits HAF_APP_SKIP_PATTERNS from the top-level variables: SQL/scripts/docker/
# Dockerfile changes DO require a re-sync; only docs/tests/CI-yaml are safe to skip.
detect_changes:
  extends: .haf_app_detect_changes
  stage: detect

# =============================================================================
# LINT
# =============================================================================
sql-lint:
  stage: lint
  image: python:3.12-slim
  needs: []
  script:
    - pip install sqlfluff==3.3.0 -q
    - sqlfluff lint db/ endpoints/ --dialect postgres
    # scripts/ and docker/ added with #57's two new .sql files. shell-lint already reads
    # both directories; sql-lint did not, so a new .sql there would have gone unlinted.
    #
    # scripts/uninstall_verify.sql passes STRICT, so it is linted strictly.
    - sqlfluff lint scripts/ --dialect postgres
    # Only docker/block-processing-healthcheck.sql needs the layout rules relaxed: it is
    # fed to psql with -v and uses :'var' substitution, which sqlfluff cannot parse (it
    # reads the colon as an operator, so every placeholder becomes a spacing or indent
    # complaint). Scoped to the one directory that contains it rather than to both, so a
    # future .sql under scripts/ is not silently exempted.
    #
    # Note that CLI --exclude-rules REPLACES .sqlfluff's exclude_rules rather than
    # merging, so this invocation also re-enables whatever that file turns off. That is
    # acceptable for one generated-style file; do not widen it.
    - sqlfluff lint docker/ --dialect postgres --exclude-rules LT01,LT02,LT14
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

openapi-drift:
  stage: lint
  image: python:3.12-slim
  needs: []
  script:
    # endpoints/endpoint_schema.sql's embedded spec and endpoints/rewrite_rules.conf
    # are GENERATED from the /** openapi:paths */ annotations, by a script a developer
    # is expected to remember to run ("Run this after adding or changing endpoint
    # annotations, then commit the result"). Nothing enforced it, so an annotation
    # edit without a regeneration -- or a hand-edit of either generated file -- shipped
    # silently, and the served spec could describe an API the rewriter does not route.
    #
    # This regenerates and fails on any diff, so the artifacts always match the
    # annotations they claim to describe.
    #
    # What it does NOT do is police the generator: the script fetches it from
    # ${COMMON_CI_REF}, which GitLab injects into this job, so the pin inside
    # scripts/openapi_rewrite.sh is never exercised here. Generator output cannot
    # drift without someone editing the pin -- which is the intended property, but
    # it also means nothing enforces that the script's default and this file's
    # COMMON_CI_REF stay equal. They are equal today; keep them so by hand.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl >/dev/null
    - bash scripts/openapi_rewrite.sh
    - |
      # git status, not `git diff`: diff ignores UNTRACKED files, so a new endpoint
      # whose generated artifact is not yet added would slip through. --porcelain is
      # stable output by contract. (The pathspec scopes this to endpoints/; the
      # script's own leftovers elsewhere are handled by its EXIT trap, and a failed
      # run fails the job at the step above regardless.)
      #
      # Capture the status explicitly rather than `if ! git ...`: git exits 0 (clean),
      # 1 (differs) and >=128 on ERROR, and treating them alike turns a runner-side
      # git problem (dubious-ownership, a GIT_STRATEGY override) into
      # "endpoints/ is not what the generator produces" followed by an EMPTY diff,
      # sending the author to regenerate a file that was already correct.
      # `if ! changed=$(...)`, not a separate $? test: gitlab-runner emits
      # `set -eo pipefail` at the top of the job script, so a failing command
      # substitution in a plain assignment kills the shell before $? is ever read.
      # The rc branch below only runs because the assignment is inside `if !`.
      if ! changed="$(git status --porcelain -- endpoints/)"; then
        echo "ERROR: git failed -- this is a runner problem, not drift."
        exit 1
      fi
      if [ -n "$changed" ]; then
        echo "ERROR: endpoints/ is not what scripts/openapi_rewrite.sh generates."
        echo "Run it locally and commit the result."
        echo "$changed"
        git --no-pager diff -- endpoints/
        exit 1
      fi
    - echo "endpoints/ matches the generator."
    # Generator-fidelity is not the same as spec validity, and this MR proved it:
    # a re-indentation that the generator faithfully reproduced turned the served
    # spec INVALID (a stray key became a phantom response property) while the diff
    # check above stayed green. Validate what we actually serve.
    # Pinned like every other tool in this file. The hadolint job a few hundred
    # lines down carries the note explaining why: an unpinned linter started
    # failing this pipeline with no repo change. A validator release that adds or
    # tightens an OpenAPI 3.1 rule would do exactly that here.
    - pip install openapi-spec-validator==0.9.0 -q
    - |
      python - <<'PY'
      import re, sys, json
      from openapi_spec_validator import OpenAPIV31SpecValidator
      src = open("endpoints/endpoint_schema.sql", encoding="utf-8").read()
      m = re.search(r"openapi json = \$\$(.*?)\$\$;", src, re.S)
      if not m:
          sys.exit("could not extract the embedded OpenAPI blob")
      errs = list(OpenAPIV31SpecValidator(json.loads(m.group(1))).iter_errors())
      for e in errs:
          print("INVALID:", list(e.absolute_path), "-", str(e)[:200])
      sys.exit(1 if errs else 0)
      PY
    - echo "served OpenAPI document is valid." 
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# haf-drift -- the only thing in this repo that compares our HAF transcription
# against hive/haf. See scripts/check_haf_drift.sh for why it is greps and not a
# schema diff, and for the subshell bug that made an earlier version report
# "No drift" having run zero checks. (#87)
#
# TWO JOBS ON PURPOSE, and the split is the point.
#
# The first version was a single advisory job against `develop`, justified on the
# grounds that a third-party branch moving on its own schedule would redden
# unrelated MRs -- and a check that does that gets deleted rather than acted on.
# That reasoning is right about `develop` and wrong as a whole, because it left the
# version we actually RUN unchecked by anything blocking. Review made the better
# argument: the moving input is a CHOICE.
#
#   haf-drift          pinned tag, from docker/.env. Deterministic -- it can only
#                      change when WE bump the pin, which is exactly when someone
#                      should be looking. So it BLOCKS.
#   haf-drift-develop  develop. Early warning for something that has not reached
#                      our pin yet. Advisory, because upstream's schedule is not
#                      ours.
#
# The pinned ref is DERIVED from docker/.env by the script (HAF_DRIFT_REF=pinned),
# not repeated here: a tag written in two places is a tag that gets updated in one.
.haf_drift_template:
  stage: lint
  image: alpine:3.20
  needs: []
  before_script:
    - apk add --no-cache bash curl >/dev/null
  rules:
    - if: $CI_COMMIT_BRANCH

# Blocking. Checks the HAF we pin and run.
haf-drift:
  extends: .haf_drift_template
  variables:
    HAF_DRIFT_REF: "pinned"
  script:
    - bash scripts/check_haf_drift.sh

# Advisory. Checks where HAF is going.
#
# allow_failure is honest here rather than defensive: a yellow triangle is easy to
# miss, so this job is early warning only, and haf-drift above is what actually
# defends the branch. If this one goes yellow, upstream has changed something we
# transcribe and the pinned job will go RED the day we bump HAF_VERSION.
haf-drift-develop:
  extends: .haf_drift_template
  variables:
    HAF_DRIFT_REF: "develop"
  script:
    - bash scripts/check_haf_drift.sh
  allow_failure: true

shell-lint:
  stage: lint
  # Pinned, for the reason sql-lint pins sqlfluff: an unpinned linter means a drifting
  # build can fail unchanged code. :latest was 0.11.0 when this was pinned.
  image: koalaman/shellcheck-alpine:v0.11.0
  needs: []
  script:
    - find scripts/ docker/ -name "*.sh" -exec shellcheck --severity=warning {} +
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

# Behavioural tests for the shell scripts that make up the image contract (#57):
# the entrypoint's verb dispatch, the block-processing healthcheck, the uninstall
# teardown and both option loops. They drive the real scripts against a stub psql on
# PATH, so they need only bash and pytest -- no database, no image.
#
# They exist because these scripts had NO coverage and the failure modes are silent: a
# healthcheck that answers "healthy" unconditionally fails no pipeline, and on a live
# node the symptom is the absence of an alert. Mutation testing on the sibling app
# (hive/haf_fyp!50) found 26 of 59 deliberate breakages surviving before this suite
# shape was hardened.
shell-tests:
  stage: lint
  # Pinned for the reason shell-lint and sql-lint pin theirs, and because this file
  # already pins `pytest<9` elsewhere: pytest 9 dropped an internal tavern depends on.
  image: python:3.11-slim
  needs: []
  script:
    # pyyaml: tests/unit/test_compose_contract.py parses docker-compose.yml. It FAILS
    # rather than skips when the module is missing under CI, for the same reason the
    # bash harness does -- a silent skip would put the compose file back to uncovered.
    - pip install --quiet 'pytest<9' pyyaml
    # CI is set, so tests/unit/shell_harness.py FAILS rather than skips if bash ever
    # leaves the image -- otherwise every shell test would quietly stop running and the
    # pipeline would stay green with the scripts uncovered.
    - PYTHONPATH=. pytest tests/unit/ -q
  rules:
    - if: $CI_COMMIT_BRANCH

hadolint:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  needs: []
  script:
    # DL3066 (non-numeric user-id): "USER root" is deliberate (DL3002 is already
    # ignored for the same reason); the rule appeared in a newer hadolint and the
    # unpinned latest-alpine image made it start failing without a repo change.
    - hadolint --ignore DL3006 --ignore DL3002 --ignore DL3066 Dockerfile
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

compose-validate:
  stage: lint
  image: docker:24
  needs: []
  variables:
    # Dummy values so variable interpolation resolves during `config`.
    HAF_IMAGE_NAME: "registry.example.com/haf/instance:latest"
    HAF_STATS_IMAGE: "registry.example.com/haf_stats:latest"
    POSTGREST_IMAGE: "registry.example.com/postgrest:latest"
    HAF_REGISTRY: "registry.example.com"
    HAF_VERSION: "latest"
    HAF_STATS_REGISTRY: "registry.example.com"
    HAF_STATS_VERSION: "latest"
    POSTGREST_VERSION: "latest"
    HAF_DATA_DIRECTORY: "/tmp/haf_data"
    HAF_SHM_DIRECTORY: "/tmp/haf_shm"
  script:
    - cd docker
    - docker compose -f docker-compose.yml -f overrides/ci.yml config --quiet
    - docker compose -f docker-compose-ci-test.yml config --quiet
    - docker compose -f docker-compose-ci-install.yml config --quiet
    # ...and again with HAF_STATS_IMAGE UNSET, which is how pattern-test and
    # regression-test actually read this file. The dummy above masks that: on pipeline
    # 178863 a `${HAF_STATS_IMAGE:?}` in the PROFILED haf-stats-setup service passed
    # this lint and then broke both sibling lanes, because compose interpolates EVERY
    # service in the file -- `profiles:` gates whether a service STARTS, not whether
    # its definition is interpolated. This turns that incident into a 15-second gate.
    - env -u HAF_STATS_IMAGE docker compose -f docker-compose-ci-test.yml config --quiet
    - docker compose -f docker-compose-ci.yml config --quiet
    - docker compose --env-file .env -f docker-compose-test.yml config --quiet
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# BUILD
# =============================================================================
# Build + push this commit's haf_stats image so the sync job can pull it.
docker-build:
  stage: build
  image: docker:24
  needs: []
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --build-arg GIT_HASH="$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Smoke-run the image (#57). Be precise about the gap this closes, because an
    # earlier revision of this comment overstated it: the `sync` job DOES start
    # containers from this image and exercises install_app/process_blocks for real. What
    # had no coverage was the dispatcher's ERROR paths, every --help path, and the
    # healthcheck script -- which `sync` overrides away via CI_FAST_HEALTHCHECK_SERVICES.
    # Those are all fast, so they belong here rather than behind a 2-hour replay. That is not hypothetical: the
    # sibling app (hive/haf_fyp!50) shipped `date --utc --iso-8601=seconds`, a GNU long
    # option BusyBox does not have, in the first line of process_blocks.sh -- which under
    # `set -e` would have crash-looped the block processor on every deployment.
    #
    # Every assertion greps for an expected message rather than accepting any non-zero
    # status: a bare `! docker run ...` also passes on 127, so it would "verify" a file
    # that had never been COPYed. `timeout` because a job that hangs reports "job
    # timeout" rather than a diff.
    #
    # These run without a database on purpose: each exercises a path that resolves
    # before the first connection. `uninstall_app` without --force is deliberately NOT
    # smoke-tested -- it calls wait_for_postgres BEFORE its no-TTY refusal, so it would
    # hang here rather than fail. A unit test covers it instead.
    - |
      set -e
      IMG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      expect_ok()   { timeout 60 docker run --rm "$IMG" "$@"; }
      # 124 is timeout's own kill, 125/126 are docker/exec failures, 127 is
      # "not found" -- none of them is the script rejecting its input. Excluding
      # them is the rule round two arrived at the hard way: an assertion whose
      # expected outcome is a non-zero exit must name a SPECIFIC reachable exit.
      expect_fail() { rc=0; timeout 60 docker run --rm "$IMG" "$@" >/tmp/o 2>&1 || rc=$?; cat /tmp/o; case "$rc" in 0|124|125|126|127) return 1 ;; *) return 0 ;; esac; }

      echo "--- the image's userland is what the scripts assume ---"
      # Asserted in three places in this repo and verified nowhere until now: that the
      # base is Alpine (so `date` is BusyBox and has no --iso-8601), and that bash exists
      # for the #!/bin/bash scripts. One line settles both.
      docker run --rm --entrypoint /bin/sh "$IMG" -c 'set -e; date -uIseconds; command -v bash psql pg_isready sed'
      echo "--- entrypoint dispatches its own usage on stdout ---"
      expect_ok --help | grep -q "install_app"
      echo "--- unknown verb fails with the right message, not merely non-zero ---"
      expect_fail install-app; grep -q "unknown verb: install-app" /tmp/o
      echo "--- the scripts parse and render help under the image's BusyBox userland ---"
      expect_ok install_app    --help | grep -q -- "--swagger-url"
      expect_ok uninstall_app  --help | grep -q -- "--force"
      expect_ok process_blocks --help | grep -q -- "--host"
      echo "--- an invalid option is rejected, not ignored ---"
      expect_fail install_app --nope; grep -q "is not a valid option" /tmp/o
      echo "--- a foreign --schema warns and does NOT exit at the option loop ---"
      # It must not hard-fail: upstream module files pass --schema= to process_blocks on
      # a service that is `restart: on-failure`, so exiting here is a permanent
      # crash-loop.
      #
      # `--help` AFTER it, deliberately. The option loop processes every argument, so the
      # warning is emitted and then --help exits 0 -- WITHOUT falling into
      # wait_for_postgres. The previous form was `expect_fail install_app
      # --schema=btracker_app`, which HUNG this job for 58 minutes on the first run after
      # the hard failure was removed: with nothing to exit at, the script reached
      # wait_for_postgres, an unbounded `until pg_isready; do sleep 2; done`, against a
      # container that has no `haf` host. `timeout 60` did not save it -- it kills the
      # docker CLI while the container keeps running and holds the redirect open, so the
      # shell waits on the pipe. The job had to be cancelled by hand.
      #
      # Two lessons kept here on purpose: an assertion whose expected outcome is a
      # NON-zero exit must name a specific reachable exit, not "anything but 0"; and a
      # smoke test must never invoke a verb in a way that reaches the connect.
      expect_ok install_app --schema=btracker_app --help >/tmp/o 2>&1; cat /tmp/o
      grep -q "WARNING: --schema" /tmp/o
      echo "--- a connection URI is REFUSED, not half-honoured ---"
      # Honouring it moved only the psql connection: the messages and the teardown's
      # confirmation prompt still read POSTGRES_HOST/POSTGRES_DB, so it could act on one
      # database while reporting another. Refusing is safe -- --postgres-url appears in
      # one upstream module file, on a service with no restart policy.
      for verb in install_app uninstall_app process_blocks; do
        expect_fail "$verb" --postgres-url=postgresql://haf_admin@haf/haf_block_log
        grep -q "not supported yet" /tmp/o || { echo "FAIL: $verb did not refuse --postgres-url clearly"; exit 1; }
        grep -q -- "--host=" /tmp/o || { echo "FAIL: $verb did not name the alternative flags"; exit 1; }
      done
      echo "--- the compat path the LIVE node uses still dispatches ---"
      expect_ok /app/scripts/install_app.sh --help | grep -q -- "--swagger-url"
      echo "--- the healthcheck ships at the path module files hardcode ---"
      expect_ok test -r /app/block-processing-healthcheck.sql
      timeout 60 docker run --rm --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h 2>&1 && exit 1
      cat /tmp/h; grep -q "hasn.t started yet" /tmp/h
      echo "--- and fails CLOSED when it has a startup time but no database ---"
      timeout 60 docker run --rm -e HAF_STATS_STARTUP_TIME_FILE=/etc/hostname         --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h2 2>&1 && exit 1
      cat /tmp/h2
      grep -q "psql: error:" /tmp/h2
      # `if ... then exit 1`, NOT `! grep ...`. POSIX and bash both exempt a
      # !-inverted pipeline from errexit, so `set -e; ! grep -q X` CONTINUES when X
      # matches -- the assertion could never fail. Verified locally.
      if grep -q "healthcheck SQL not found" /tmp/h2; then
        echo "the healthcheck could not find its .sql -- COPY missing?" >&2; exit 1
      fi
      echo "image smoke tests passed"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

# Build + push the PostgREST URL rewriter image (Dockerfile.rewriter: openresty
# serving clean REST URLs that map to /rpc/ calls, per the rules generated from
# the OpenAPI annotations). Published as $CI_REGISTRY_IMAGE/rewriter:<sha> so a
# downstream stack (haf_api_node) can pin it alongside the app image.
docker-build-rewriter:
  stage: build
  image: docker:24
  needs: []
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile.rewriter
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg GIT_LAST_LOG_MESSAGE="$CI_COMMIT_TITLE"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        -t "$CI_REGISTRY_IMAGE/rewriter:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/rewriter:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH

# Replay the 5M reference chain ONCE and cache the HAF datadir (cache type `haf`,
# keyed by HAF_COMMIT). Shared across all app commits — cache-hit runs are instant.
prepare_haf_data:
  extends: .haf_app_prepare_data_with_find
  stage: build
  timeout: 2h
  variables:
    BLOCK_LOG_SOURCE_DIR: "$BLOCK_LOG_SOURCE_DIR_5M"
    CONFIG_INI_SOURCE: "/tmp/config_5M.ini"
  before_script:
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/config_5M.ini" -o /tmp/config_5M.ini
    - echo "Using HAF image:${HAF_IMAGE_NAME} (commit:${HAF_COMMIT})"
  # Warm the shared HAF replay cache on NFS when it's missing, so a `sync` that
  # lands on a different builder gets a hit instead of dying on an NFS miss.
  #
  # Why this is needed (two stacked gaps in the shared tooling):
  #   1. .prepare_haf_data_5m only pushes to NFS on a fresh replay; when
  #      cache-manager serves the tar from a builder's LOCAL /cache it treats that
  #      as an "NFS hit" and skips the push.
  #   2. `cache-manager put` itself short-circuits on an NFS *client*: if the
  #      local tar (/cache/<type>_<key>.tar) already exists it returns success
  #      WITHOUT copying to NFS (cmd_put "Local cache already exists" early-return).
  # So a HAF commit whose tar is stranded in client-local caches (NFS copy never
  # written, or evicted while local copies survive) never reaches the NFS host's
  # storage, and cross-builder sync fails. haf_stats runs too rarely to rely on
  # the ambient NFS warmth that keeps higher-volume HAF apps green.
  #
  # cmd_get only needs the .tar present for an NFS hit, and its own push is just an
  # atomic `cp local -> NFS`, so we replicate exactly that, bypassing put's
  # short-circuit. Copies the already-built local tar (no re-tar), is a no-op once
  # NFS is warm, and is a safe no-op on the NFS host (no /cache/<type>_<key>.tar).
  script:
    - !reference [.prepare_haf_data_5m, script]
    - |
      NFS_TAR="${CACHE_NFS_PATH:-/nfs/ci-cache}/${HAF_CACHE_TYPE:-haf}/${HAF_COMMIT}.tar"
      LOCAL_TAR="${CACHE_LOCAL_PATH:-/cache}/${HAF_CACHE_TYPE:-haf}_${HAF_COMMIT}.tar"
      if [[ -n "${FILTERED_CACHE_KEY:-}" ]]; then
        echo "NFS warm guard: skipped (custom cache key)"
      elif head -c1 "$NFS_TAR" >/dev/null 2>&1; then
        # head (open syscall) not [[ -f ]] (stat): dodges the NFS negative-dentry
        # cache that can make a present file look missing for seconds.
        echo "NFS warm guard: HAF cache already on NFS ($NFS_TAR)"
      elif [[ ! -f "$LOCAL_TAR" ]]; then
        echo "NFS warm guard: no client-local tar at $LOCAL_TAR; nothing to copy (NFS host, or template already pushed)"
      else
        echo "NFS warm guard: NFS HAF cache MISSING - copying client-local tar -> NFS so cross-builder sync hits"
        TMP="${NFS_TAR}.tmp.$(hostname 2>/dev/null || echo h).${CI_JOB_ID:-$$}"
        mkdir -p "$(dirname "$NFS_TAR")"
        if cp "$LOCAL_TAR" "$TMP" && mv "$TMP" "$NFS_TAR"; then
          echo "NFS warm guard: pushed $(stat -c %s "$NFS_TAR" 2>/dev/null || echo '?') bytes to $NFS_TAR"
        else
          rm -f "$TMP" 2>/dev/null || true
          echo "WARNING: NFS warm guard copy failed (non-fatal); cross-builder sync may still miss"
        fi
      fi
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

# =============================================================================
# SYNC — install schema + process to head against the pre-replayed datadir,
# then save the combined state as the haf_haf_stats_sync cache.
# =============================================================================
sync:
  extends:
    - .docker_image_builder_job_template
    - .haf_app_sync_variables
  stage: sync
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  timeout: 2h   # NFS cache push can take a while on busy days
  needs:
    - job: detect_changes
      artifacts: true
      optional: true
    - job: find_haf_image
      artifacts: true
    - job: prepare_haf_data
      artifacts: true
    - job: docker-build
    # sync starts docker-compose.yml, which since #61 includes haf-stats-rewriter.
    - job: docker-build-rewriter
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    HAF_STATS_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    # Pin the SHA tag docker-build-rewriter just pushed. Left unset, the service falls
    # back to :latest -- a tag CI never publishes, for this image or the app image. `up`
    # logged `manifest unknown` and silently BUILT it instead (job 3270294), in a job
    # whose before_script states no builder setup is needed here. It worked, but it
    # exercised a local build rather than the artifact the pipeline produced.
    HAF_STATS_REWRITER_IMAGE: "${CI_REGISTRY_IMAGE}/rewriter:${CI_COMMIT_SHORT_SHA}"
    POSTGREST_IMAGE: "registry.gitlab.syncad.com/hive/haf_api_node/postgrest:latest"
    POSTGRES_ACCESS: "postgresql://haf_admin@docker:5432/haf_block_log"
    COMPOSE_OPTIONS_STRING: "--env-file ci.env --file docker-compose.yml --file overrides/ci.yml --ansi never"
    # process is an infinite loop, so the fast-healthcheck override targets it too.
    CI_FAST_HEALTHCHECK_SERVICES: "haf haf-stats-process"
  before_script:
    # Matches balance_tracker's sync: login + git safe.dir + CI healthcheck override
    # come from .haf_app_sync_setup; the dind daemon (services + DOCKER_HOST) is all
    # `docker compose up` needs — no buildkit/builder setup required here.
    - !reference [.haf_app_sync_setup, script]
    - !reference [.haf_app_smart_cache_lookup, script]
  script:
    - |
      CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")
      if [[ "$CACHE_HIT" == "true" ]]; then
        echo "App sync cache hit (${APP_SYNC_CACHE_TYPE}) - nothing to sync."
        exit 0
      fi
    - |
      echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting sync stack..."
      # The smart cache lookup extracted the `haf` (pre-replayed) datadir to
      # ${DATADIR}. HAF runs --skip-hived, but the compose bind-mounts
      # ./blockchain, so seed it from the cache (deref symlinks) if present.
      mkdir -p "${CI_PROJECT_DIR}/docker/blockchain"
      if [[ -d "${DATADIR}/blockchain" ]] && [[ -n "$(ls -A "${DATADIR}/blockchain" 2>/dev/null)" ]]; then
        cp -aL "${DATADIR}/blockchain"/* "${CI_PROJECT_DIR}/docker/blockchain/" 2>/dev/null || true
        sudo rm -rf "${DATADIR}/blockchain"
      fi

      cd "${CI_PROJECT_DIR}/docker"
      # PGRST_DB_URI below carries options=-c statement_timeout: it must be repeated on every
      # path that DEFINES the variable, because the docker-compose.yml default is bypassed
      # whenever it is set. Without it CI runs the endpoints against real data with no query
      # timeout at all, which is exactly where a runaway would matter most. (#48)
      cat > ci.env <<EOF
      HAF_IMAGE_NAME=${HAF_IMAGE_NAME}
      HAF_STATS_IMAGE=${HAF_STATS_IMAGE}
      POSTGREST_IMAGE=${POSTGREST_IMAGE}
      HAF_STATS_REWRITER_IMAGE=${HAF_STATS_REWRITER_IMAGE}
      HAF_DATA_DIRECTORY=${HAF_DATA_DIRECTORY}
      HAF_SHM_DIRECTORY=${HAF_SHM_DIRECTORY}
      PGRST_DB_URI=postgresql://haf_stats_owner@haf:5432/haf_block_log?options=-c%20statement_timeout%3D30s
      PGRST_DB_SCHEMA=haf_stats_endpoints
      PGRST_DB_ANON_ROLE=haf_stats_user
      PGRST_DB_EXTRA_SEARCH_PATH=haf_stats_app
      EOF
      cat ci.env

      IFS=" " read -ra COMPOSE_OPTIONS <<< "$COMPOSE_OPTIONS_STRING"
      docker compose "${COMPOSE_OPTIONS[@]}" config
      # Dump the one-shot containers' logs if `up` fails. Log collection lives in the
      # shutdown step below, which never runs when `up` itself aborts -- so an install
      # failure reported only as `service "haf-stats-setup" didn't complete
      # successfully: exit 1` left NOTHING to diagnose from, and the artifact upload
      # then failed too because no *.log had been written.
      if ! docker compose "${COMPOSE_OPTIONS[@]}" up --detach --quiet-pull; then
        echo "--- up failed; dumping one-shot container logs ---"
        docker compose "${COMPOSE_OPTIONS[@]}" logs --no-color haf-stats-setup || true
        docker compose "${COMPOSE_OPTIONS[@]}" logs --no-color --tail 100 haf || true
        exit 1
      fi
      echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for haf_stats to process to head..."
      "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-sync.sh" --postgres-access="${POSTGRES_ACCESS}"
      echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:$(date +%s):rewriter[collapsed=true]\r\e[0KThe documented surface answers..."
      cd "${CI_PROJECT_DIR}/docker"
      IFS=" " read -ra COMPOSE_OPTIONS <<< "$COMPOSE_OPTIONS_STRING"
      # #61: this is the only lane with a real HAF behind the whole stack, and until
      # now it started the rewriter and never sent it a request -- so a rewriter that
      # exited with `host not found in upstream` (the failure haf_api_node documents
      # for this image) left this job green. Ask for a PUBLIC path, not /rpc/: the
      # point is that the rewrite rules resolve, which is what `up -d` cannot show.
      # In-container, so it does not depend on a published host port.
      docker compose "${COMPOSE_OPTIONS[@]}" exec -T haf-stats-rewriter \
        wget -q -O- --timeout=10 127.0.0.1/version
      echo
      echo -e "\e[0Ksection_end:$(date +%s):rewriter\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:$(date +%s):shutdown[collapsed=true]\r\e[0KClean PostgreSQL shutdown..."
      cd "${CI_PROJECT_DIR}/docker"
      IFS=" " read -ra COMPOSE_OPTIONS <<< "$COMPOSE_OPTIONS_STRING"

      # A clean pg_ctl stop flushes WAL and writes a shutdown checkpoint so the
      # cached datadir restarts cleanly. CHECKPOINT first (informational); the
      # PG binary path varies by image version, so locate pg_ctl dynamically.
      docker compose "${COMPOSE_OPTIONS[@]}" exec -T haf psql -U haf_admin -d haf_block_log -c "CHECKPOINT;" 2>&1 || \
        echo "WARNING: checkpoint failed - pg_ctl stop will still attempt a clean shutdown"

      PG_CTL=$(docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
          bash -c 'find /usr/lib/postgresql -name pg_ctl -type f 2>/dev/null | head -1' 2>/dev/null | tr -d '\r\n')
      echo "Found pg_ctl at: ${PG_CTL:-not found}"
      if [[ -n "$PG_CTL" ]]; then
        docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m fast -t 60 2>&1 || \
        docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m immediate -t 30 2>&1 || true
      else
        echo "WARNING: pg_ctl not found, relying on docker compose down"
      fi

      docker compose "${COMPOSE_OPTIONS[@]}" logs haf > haf.log || true
      docker compose "${COMPOSE_OPTIONS[@]}" logs haf-stats-setup > haf-stats-setup.log || true
      docker compose "${COMPOSE_OPTIONS[@]}" logs haf-stats-process > haf-stats-process.log || true
      docker compose "${COMPOSE_OPTIONS[@]}" logs haf-stats-rewriter > haf-stats-rewriter.log || true
      timeout 120 docker compose "${COMPOSE_OPTIONS[@]}" down --timeout "${COMPOSE_DOWN_TIMEOUT:-60}"
      # cwd is ${CI_PROJECT_DIR}/docker, so this lands at docker/container-logs.tar.gz
      # (the path .haf_app_sync_artifacts publishes).
      tar -czvf container-logs.tar.gz ./*.log || true
      echo -e "\e[0Ksection_end:$(date +%s):shutdown\r\e[0K"
    - !reference [.haf_app_sync_save_cache_conditional, script]
  after_script: !reference [.haf_app_sync_cleanup, after_script]
  artifacts: !reference [.haf_app_sync_artifacts, artifacts]
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

# =============================================================================
# TEST — extract the haf_haf_stats_sync cache, start HAF (--skip-hived) +
# PostgREST, and run the suites. No replay, no processing: minutes, not hours.
# =============================================================================
.haf_stats_dind_test:
  extends: .haf_app_dind_complete_test
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    COMPOSE_FILE: "docker-compose-ci-test.yml"
    COMPOSE_OPTIONS_STRING: "--file docker-compose-ci-test.yml --ansi never"
    POSTGREST_IMAGE: "registry.gitlab.syncad.com/hive/haf_api_node/postgrest:latest"
  needs:
    - job: detect_changes
      artifacts: true
      optional: true
    - job: find_haf_image
      artifacts: true
    - job: sync
      artifacts: true
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

# tavern .pat.json suite — exact 2016-04 values over the replayed chain
# (negatives/synthetic edge cases run on the fast stub stack instead).
pattern-test:
  extends: .haf_stats_dind_test
  # The runner image has no pytest/tavern; .tavern_install_deps creates a venv at
  # ${CI_PROJECT_DIR}/docker/venv (compose_startup cd's into docker/) and installs
  # them. Re-reference the base before_script so it isn't clobbered by this override.
  before_script:
    - !reference [.haf_app_dind_complete_test, before_script]
    - !reference [.tavern_install_deps, script]
    - |
      # .tavern_install_deps installs pytest>=8 with no upper bound. pytest 9 dropped
      # _pytest._code.code.FormattedExcinfo, which tavern imports, breaking collection
      # at import time — the same reason the stub stack pins it (docker-compose-ci.yml).
      # Cap it here too so a future pytest 9 resolve can't break this job.
      . "${CI_PROJECT_DIR}/docker/venv/bin/activate"
      pip install --quiet 'pytest<9'
  script:
    - |
      . "${CI_PROJECT_DIR}/docker/venv/bin/activate"
      DOCKER_IP=$(getent hosts docker 2>/dev/null | awk '/^[0-9]+\./{print $1; exit}')
      DOCKER_IP="${DOCKER_IP:-docker}"
      echo "Running tavern pattern suite against http://${DOCKER_IP}:3000"
      API_URL="http://${DOCKER_IP}:3000" \
      PYTHONPATH="${CI_PROJECT_DIR}/tests/tavern" \
      TAVERN_DIR="${CI_PROJECT_DIR}/tests/tavern" \
        pytest "${CI_PROJECT_DIR}/tests/tavern" -m "not negative and not synthetic" --tb=short -v

# parity (independent in-DB re-derivation) + regression (vs external hived snapshot)
regression-test:
  extends: .haf_stats_dind_test
  script:
    - |
      echo "Running correctness guards against the cached stack (docker:5432)"
      cd "${CI_PROJECT_DIR}"
      ./scripts/run_verification.sh --host=docker --port=5432 --user=haf_admin
  artifacts:
    when: always
    paths:
      - docker/container-logs.tar.gz
    expire_in: 1 week

# =============================================================================
# Re-install gate (#74) -- install_app.sh over an ALREADY-INSTALLED database.
# =============================================================================
# Until this lane existed nothing in CI ran install_app.sh twice, so re-install
# failures could only be caught by static analysis of the SQL text. #60 reached a
# node exactly that way: green in every lane, exit 3 on the first re-install.
#
# WHAT THIS DOES AND DOES NOT COVER. Both installs run the SAME image, so this is
# an idempotency guard, not an upgrade guard:
#
#   COVERED -- a statement that raises only on the SECOND run: #60 itself (a DROP
#     whose signature does not match its plain CREATE), but also ALTER TABLE ADD
#     CONSTRAINT (no IF NOT EXISTS form), DML without ON CONFLICT, and anything in
#     the ~13 inline `psql_cmd -c` statements in install_app.sh, which live in no
#     .sql file the static scanner reads. Proven by negative control #1.
#     Note tests/unit/test_sql_idempotency.py already covers much of this class in
#     ~3s, so the marginal value here is only what its regexes do not model.
#   COVERED -- installer NON-CONVERGENCE in privileges/ACLs, which the schema diff
#     catches and an exit code cannot. Proven by negative control #2: a
#     `GRANT ... ON ALL FUNCTIONS IN SCHEMA` placed before the functions exist is a
#     silent no-op on install 1 and grants them on install 2 (it is a snapshot, not
#     a rule). Both installs exit 0; 239 lines differed. No static rule over SQL
#     text can model this -- the outcome depends on database STATE when the
#     statement runs. This is the one class the lane uniquely owns.
#     Note the diff is SCHEMA-SCOPED to the three app schemas. Role-level state is
#     outside it: db/builtin_roles.sql runs ALTER ROLE and GRANT/REVOKE on roles and
#     on schemas hafd/hive on every install, and none of that appears in
#     `pg_dump --schema-only -n haf_stats_app -n haf_stats_backend -n haf_stats_endpoints`.
#     A regression there is caught only if it makes the install exit non-zero.
#   NOT COVERED -- DATA-level idempotency. Assertion 2 is --schema-only, so a
#     backfill that double-counts or a rollup refreshed twice passes green. Only
#     data defects that RAISE are caught, via the exit code.
#   NOT COVERED -- a return-type change under CREATE OR REPLACE, which is the
#     class #73's nine DROPs defend against. That failure only exists BETWEEN
#     releases, and installing one commit over itself cannot produce it. Closing
#     it needs the first install to come from the merge target's image; tracked as
#     #78. Do not read a green run here as evidence that #73's DROPs work.
#
# Placement is the test stage, not the end of `sync`, because `sync` returns early
# on a cache hit,
#
#     CACHE_HIT=$(cat /tmp/cache_hit ...); if [[ "$CACHE_HIT" == "true" ]]; then exit 0
#
# and exits before the stack is ever started -- so a re-install appended there
# would be skipped on exactly the common case, while #74 requires it to run on a
# cache hit. The test stage extracts the same cache and starts the same HAF on
# every pipeline.
reinstall-test:
  extends: .haf_stats_dind_test
  needs:
    # Inherited needs cover detect_changes/find_haf_image/sync, and sync needs
    # docker-build -- so on a fresh pipeline the per-commit tag always exists. Named
    # explicitly anyway: this and install-test are the only test-stage jobs that pull
    # ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}, and the sibling lanes replay from the
    # cached datadir without an app image. On a single-job retry of an old pipeline
    # after registry cleanup has reaped that tag, this job alone dies on the pull.
    # haf_stats#51 was this class against hive/haf's registry.
    - job: detect_changes
      artifacts: true
      optional: true
    - job: find_haf_image
      artifacts: true
    - job: sync
      artifacts: true
    - job: docker-build
  # A red run here cannot block a merge (only_allow_merge_if_pipeline_succeeds is off),
  # so a flake is pure noise that people learn to ignore. Retry only infrastructure
  # classes -- never script_failure, which is the signal this lane exists to produce.
  # Note stuck_or_timeout_failure covers a job never picked up, NOT one exceeding the
  # inherited 30-minute timeout -- that is job_execution_timeout, deliberately absent,
  # because a 30-minute hang here wants investigating rather than repeating.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    # The other test jobs never need this (the ci-test stack has no haf_stats
    # service of its own), so it is set here rather than in .haf_stats_dind_test.
    # Same tag docker-build pushes and sync consumes.
    HAF_STATS_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  script:
    - |
      cd "${CI_PROJECT_DIR}/docker"
      # Record WHAT WAS ACTUALLY INSTALLED. The compose default only protects against
      # an unset/empty variable; a valid-but-wrong tag (:latest, a develop tag, a
      # typo'd registry) sails past it and the lane goes green having installed a
      # different commit. It cannot be recovered after the fact -- `compose config`
      # filters inactive-profile services out of its output -- so print it.
      echo "reinstall-test: image under test = ${HAF_STATS_IMAGE}"
    - |
      cd "${CI_PROJECT_DIR}/docker"
      # The PG binaries are not reliably on PATH in the haf image -- `sync` already has
      # to locate pg_ctl this way for the same reason -- so find pg_dump rather than
      # assume it. Failing here with a clear message beats a bare "executable file not
      # found" from docker exec. tr -d matches the idiom sync uses for pg_ctl.
      PG_DUMP=$(docker compose --env-file ci.env --file docker-compose-ci-test.yml --ansi never exec -T haf bash -c 'command -v pg_dump || find /usr/lib/postgresql -name pg_dump -type f 2>/dev/null | head -1' | tr -d '\r\n')
      if [[ -z "$PG_DUMP" ]]; then
        echo "FAIL: pg_dump not found inside the haf container; cannot take a schema snapshot."
        exit 1
      fi
      echo "Using pg_dump at: ${PG_DUMP}"
      echo "Capturing the installed schema before re-installing..."
      # pg_dump 17 emits a RANDOM nonce in its restrict/unrestrict guard lines on every
      # run (they exist to stop a dump smuggling psql meta-commands into a restore).
      # They are not schema and they differ on every invocation, so they are stripped
      # before comparing -- otherwise this assertion fails 100% of the time. Observed
      # across three runs of this lane: 10875 lines, stable, with exactly the two nonce
      # lines differing.
      docker compose --env-file ci.env --file docker-compose-ci-test.yml --ansi never exec -T haf "$PG_DUMP" -U haf_admin -d haf_block_log --schema-only --strict-names -n haf_stats_app -n haf_stats_backend -n haf_stats_endpoints | sed -E '/^\\(un)?restrict /d' > schema-before.sql
      # --strict-names above is what guarantees all three schemas are really present:
      # without it `pg_dump -n a -n b -n c` errors only when NO pattern matches, so a
      # renamed schema would silently narrow the dump to the survivors and a
      # byte-comparison of two equally-narrowed dumps would still "pass". A grep for the
      # schema NAMES cannot substitute for it -- db/op_type_registry.sql embeds all three
      # as string literals inside a function body, so one dumped function satisfies the
      # grep even when two schemas are missing entirely.
      #
      # The line floor is only a second line of defence against a TRUNCATED dump, and
      # it deliberately avoids a constant pinned to today's schema size: such a
      # constant decays, because nobody edits CI when the schema grows, and it
      # eventually asserts nothing while looking like it asserts something. This is a
      # catastrophic-empty check only; the after-dump is compared to the before-dump
      # below, which self-calibrates and needs no maintenance.
      LINES=$(wc -l < schema-before.sql)
      echo "schema-before.sql: ${LINES} lines"
      if [[ "${LINES}" -lt 1000 ]]; then
        echo "FAIL: schema dump is only ${LINES} lines; the install cannot have succeeded."
        exit 1
      fi
    - |
      cd "${CI_PROJECT_DIR}/docker"
      echo "Re-running install_app over the already-installed cache database..."
      # --no-deps: haf is already running from the template's compose startup. Without
      # it, compose would try to (re)create the dependency and disturb the very stack
      # the assertions read.
      docker compose --env-file ci.env --file docker-compose-ci-test.yml --ansi never run --rm --no-deps haf-stats-setup
      echo "Second install exited 0."
    - |
      cd "${CI_PROJECT_DIR}/docker"
      echo "Capturing the schema after..."
      docker compose --env-file ci.env --file docker-compose-ci-test.yml --ansi never exec -T haf "$PG_DUMP" -U haf_admin -d haf_block_log --schema-only --strict-names -n haf_stats_app -n haf_stats_backend -n haf_stats_endpoints | sed -E '/^\\(un)?restrict /d' > schema-after.sql
      # Compare the two dumps to EACH OTHER rather than to a constant: this catches a
      # truncation that hit only the second dump, and stays correct as the schema
      # grows. An identical truncation of both would still pass, but that needs
      # pipefail off AND both dumps failing the same way.
      AFTER_LINES=$(wc -l < schema-after.sql)
      echo "schema-after.sql: ${AFTER_LINES} lines (before: ${LINES})"
      if [[ "${AFTER_LINES}" -lt $(( LINES * 95 / 100 )) ]]; then
        echo "FAIL: after-dump is ${AFTER_LINES} lines against ${LINES} before -- that is"
        echo "a truncated dump, not a schema change; the diff would be unreliable."
        exit 1
      fi
      if diff -u schema-before.sql schema-after.sql > schema.diff; then
        echo "OK: the second install left the schema byte-identical."
        # Nothing to publish on success: the diff is empty and the dumps are identical.
        # A failure exits before this line, so the evidence survives exactly when needed.
        rm -f schema-before.sql schema-after.sql schema.diff
      else
        echo "FAIL: the second install changed the schema."
        echo "A function recreated without its GRANT (DROP discards privileges where"
        echo "CREATE OR REPLACE preserves them), or an object rebuilt with different"
        echo "properties, appears below. See hive/haf_stats#73 and #74."
        head -200 schema.diff
        exit 1
      fi
  artifacts:
    # `artifacts:` is a HASH, not a list -- one `when:` for the whole job, so the dumps
    # cannot be declared on_failure separately from the logs. Instead the success path
    # DELETES them (see the final script block): on a green run schema.diff is empty and
    # the two dumps are identical, so uploading ~10875 lines twice per pipeline is pure
    # storage cost. On any failure the script exits before that cleanup and the files
    # survive to be uploaded. schema-before.sql exists even on the install-failure path;
    # only schema-after.sql is absent there, and a missing path is a warning, not an error.
    when: always
    paths:
      - docker/container-logs.tar.gz
      - docker/schema.diff
      - docker/schema-before.sql
      - docker/schema-after.sql
    expire_in: 1 week

# =============================================================================
# Fast stub gate — validation + synthetic/negative edge cases, no replay.
# Runs on every push regardless of the cached-replay pipeline above.
# =============================================================================
endpoint-tests:
  stage: test
  image: docker:24
  needs: []
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # --build is load-bearing for LOCAL runs of this same file: compose only
    # builds when the derived image is absent, so after the first run an edit to
    # endpoints/rewrite_rules.conf would be silently ignored and the suite would
    # go green on the old rules -- exactly the failure this lane exists to catch.
    # In CI's ephemeral dind nothing is cached, so it changes nothing there.
    - docker compose -f docker/docker-compose-ci.yml up --detach --build
    - docker compose -f docker/docker-compose-ci.yml wait tavern
  after_script:
    - docker compose -f docker/docker-compose-ci.yml logs setup
    - docker compose -f docker/docker-compose-ci.yml logs tavern
    # With REWRITE_LOG=on this is what turns "some path 404'd" into "that rule
    # rewrote to X". `|| true` because after_script runs under set -e: if the build
    # failed the service has no container, and a non-zero here would skip the
    # `down -v` below.
    - docker compose -f docker/docker-compose-ci.yml logs rewriter || true
    - docker compose -f docker/docker-compose-ci.yml down -v
  rules:
    # Branch pipelines only (Workflows/Branch-Pipelines.gitlab-ci.yml does not
    # create merge_request_event pipelines); GitLab shows the branch pipeline in
    # the MR. Matches balance_tracker.
    - if: $CI_COMMIT_BRANCH

install-test:
  stage: test
  image: docker:24
  # The published app image, so this lane runs the artifact the pipeline produced rather
  # than a local rebuild. docker-build's rules are `if: $CI_COMMIT_BRANCH`, the same as
  # this job's, so there is no pipeline where this exists and that one is skipped.
  needs:
    - job: docker-build
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    HAF_STATS_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # #84: the REAL install_app.sh against a REAL PostgreSQL, in ~18s. Before this, the
    # only lanes that ran the installer needed a replayed HAF -- `sync` (374.5-566.2s
    # across the six successful runs in the project's last 100 jobs) and `reinstall-test`,
    # which is gated behind it. Nothing cheap ran it: the unit suite stubs psql (so it
    # cannot fail the way the server does) and the endpoint-tests lane psql's the SQL
    # files directly without the script.
    #
    # Waiting on `verify` rather than `install` on purpose -- the install exiting 0 proves
    # very little on a stubbed HAF, so the gate is what it LEFT BEHIND.
    # `timeout` because compose's service_completed_successfully has none of its own, and
    # install_app.sh opens with an UNBOUNDED `until pg_isready; do sleep 2; done`. If the
    # database dies mid-lane, `up` never returns and an 18-second job holds a runner until
    # the project's 3600s timeout -- the same shape as the 58-minute docker-build hang this
    # file documents elsewhere. after_script still runs, so diagnosability is unaffected.
    #
    # BOTH commands are wrapped. An earlier revision timed out only the `up`, which left
    # the `wait` below unbounded -- and `wait` is the one that actually blocks for the
    # length of the lane, so the hole was in the half that mattered.
    - timeout 600 docker compose -f docker/docker-compose-ci-install.yml up --detach
    # verify-gone is LAST in the chain (db-setup -> install -> seed-repair -> install-again
    # -> verify -> uninstall -> verify-gone), so waiting on it gates the whole lane.
    # Waiting on `verify` would let a teardown failure pass unnoticed.
    - timeout 600 docker compose -f docker/docker-compose-ci-install.yml wait verify-gone
  after_script:
    # Both installs, because the second is where a non-idempotent step or a shim that
    # quietly does nothing shows up -- the first run alone looks identical either way.
    #
    # postgres FIRST, and it is not optional. Every one-shot service below gates
    # transitively on `postgres: service_healthy`, so if postgres fails to start or fails
    # its healthcheck, NONE of them ever runs and none of them has any logs -- the job
    # would emit seven empty sections and a `down -v`, with the actual cause nowhere.
    # `ps -a` for the same reason: it shows exit codes for services that produced no
    # output at all.
    - docker compose -f docker/docker-compose-ci-install.yml ps -a || true
    - docker compose -f docker/docker-compose-ci-install.yml logs postgres || true
    - docker compose -f docker/docker-compose-ci-install.yml logs db-setup || true
    - docker compose -f docker/docker-compose-ci-install.yml logs install || true
    - docker compose -f docker/docker-compose-ci-install.yml logs seed-repair || true
    - docker compose -f docker/docker-compose-ci-install.yml logs install-again || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify || true
    - docker compose -f docker/docker-compose-ci-install.yml logs uninstall || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-gone || true
    - docker compose -f docker/docker-compose-ci-install.yml down -v || true
  rules:
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# CLEANUP — manual NFS cache pruning.
# =============================================================================
cache_cleanup:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/*haf_haf_stats_sync_*"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast
